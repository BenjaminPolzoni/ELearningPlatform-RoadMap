# Public entry point of the local stack. See path/01-arquitectura-y-stack.md §2.
#
# In real production: Browser → Nginx → BFF (not ours) → API Gateway → roadmap-service.
# Here, since we do not build the BFF, /api/ goes straight to the Gateway — trivial swap when
# the team that owns the BFF has theirs: change the upstream below.

server {
    listen 80;
    server_name _;

    # Angular static files (production build).
    root /usr/share/nginx/html;
    index index.html;

    # The 3D assets are not Angular Router routes. A missing GLB must answer 404;
    # returning index.html with 200 would make GLTFLoader try to parse HTML as binary.
    location /world-3d/ {
        try_files $uri =404;
    }

    location / {
        # SPA: any route that is not a file falls to index.html (Angular Router).
        try_files $uri $uri/ /index.html;
    }

    # TODO: point to a "bff" service when an own stand-in or the real one exists.
    # Today: straight to the local Gateway, skipping the BFF consolidation layer.
    location /api/ {
        proxy_pass http://gateway:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
