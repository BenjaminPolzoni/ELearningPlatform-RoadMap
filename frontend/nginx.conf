# Entrada pública del stack local. Ver path/01-arquitectura-y-stack.md §2.
#
# En producción real: Navegador → Nginx → BFF (no es nuestro) → API Gateway → roadmap-service.
# Acá, como el BFF no lo construimos, /api/ va directo al Gateway — swap trivial cuando
# el equipo dueño del BFF tenga el suyo: cambiar el upstream de abajo.

server {
    listen 80;
    server_name _;

    # Estáticos de Angular (build de producción).
    root /usr/share/nginx/html;
    index index.html;

    location / {
        # SPA: cualquier ruta que no sea un archivo cae en index.html (Angular Router).
        try_files $uri $uri/ /index.html;
    }

    # TODO: apuntar a un servicio "bff" cuando exista un stand-in propio o el real.
    # Hoy: directo al Gateway local, salteando la capa de consolidación del BFF.
    location /api/ {
        proxy_pass http://gateway:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
