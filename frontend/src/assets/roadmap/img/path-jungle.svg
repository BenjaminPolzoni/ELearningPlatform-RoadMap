<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 768" width="1024" height="768">
  <desc>Camino de tierra pixelado e imperfecto para fondo de ruinas en la selva</desc>
  <defs>
    <!-- Definimos colores de la paleta de selva para el efecto granulado -->
    <style>
      .grass-base { fill: #2c8c4c; } /* Color de la hierba de fondo */
      .dirt-dark { fill: #8d6e63; }  /* Color oscuro del camino */
      .dirt-light { fill: #a1887f; } /* Color claro del camino */
    </style>
  </defs>
  
  <!-- Estructura del camino de tierra (bloques base y efecto granulado) -->
  <g id="path-3-jungle">
    <!-- Bloques Base (Rectangulares) -->
    <rect x="210" y="550" width="100" height="40" class="dirt-dark" />
    <rect x="310" y="510" width="100" height="40" class="dirt-dark" />
    <rect x="410" y="470" width="100" height="40" class="dirt-dark" />
    <rect x="510" y="430" width="100" height="40" class="dirt-dark" />
    <rect x="610" y="390" width="100" height="40" class="dirt-dark" />
    <rect x="710" y="350" width="100" height="40" class="dirt-dark" />
    <rect x="810" y="310" width="100" height="40" class="dirt-dark" />
    
    <!-- Bloques de Cima (Color claro para profundidad) -->
    <rect x="210" y="510" width="100" height="40" class="dirt-light" />
    <rect x="310" y="470" width="100" height="40" class="dirt-light" />
    <rect x="410" y="430" width="100" height="40" class="dirt-light" />
    <rect x="510" y="390" width="100" height="40" class="dirt-light" />
    <rect x="610" y="350" width="100" height="40" class="dirt-light" />
    <rect x="710" y="310" width="100" height="40" class="dirt-light" />
    <rect x="810" y="270" width="100" height="40" class="dirt-light" />
    
    <!-- Efecto Granulado/Desvanecimiento (Píxeles dispersos) -->
    <rect x="208" y="512" width="2" height="2" class="grass-base" /> <!-- Píxel de hierba -->
    <rect x="210" y="508" width="2" height="2" class="dirt-light" /> <!-- Píxel de tierra -->
    <rect x="508" y="392" width="2" height="2" class="grass-base" />
    <rect x="510" y="388" width="2" height="2" class="dirt-light" />
    <rect x="808" y="272" width="2" height="2" class="grass-base" />
    <rect x="810" y="268" width="2" height="2" class="dirt-light" />
    <rect x="908" y="272" width="2" height="2" class="grass-base" />
    <rect x="910" y="268" width="2" height="2" class="dirt-light" />
    <!-- ... añadir más píxeles aquí ... -->
  </g>
</svg>
