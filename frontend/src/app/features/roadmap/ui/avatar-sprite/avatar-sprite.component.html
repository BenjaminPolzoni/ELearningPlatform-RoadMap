<span [class.celebrating]="celebrating()">
  <svg
    [attr.height]="height()"
    viewBox="0 0 16 22"
    class="pixelated overflow-visible"
    [class.walking]="walking()"
    [style.width.px]="height() * (16 / 22)"
    [style.transform]="facing() === 'left' ? 'scaleX(-1)' : null"
    role="img"
    [attr.aria-label]="label()"
  >
    <!-- shadow on the floor: anchors the sprite on the island / the square -->
    @if (shadow()) {
      <ellipse cx="8" cy="22" rx="6" ry="1.4" fill="#0E0120" opacity="0.55" />
    }

    <!-- legs and shoes -->
    <g data-layer="legs">
      <rect x="4" y="17" width="3" height="4" [attr.fill]="pants()" />
      <rect x="9" y="17" width="3" height="4" [attr.fill]="pants()" />
      <rect x="3" y="21" width="4" height="1" [attr.fill]="shoes()" />
      <rect x="9" y="21" width="4" height="1" [attr.fill]="shoes()" />
    </g>

    <!-- torso: the silhouette defines the outline; the garment only adds details on top -->
    <g data-layer="torso" [attr.data-silhouette]="config().gender">
      @if (config().gender === 'female') {
        <rect x="4" y="11" width="8" height="3" [attr.fill]="clothes().base" />
        <rect x="5" y="14" width="6" height="2" [attr.fill]="clothes().base" />
        <rect x="4" y="16" width="8" height="1" [attr.fill]="clothes().base" />
      } @else {
        <rect x="4" y="11" width="8" height="6" [attr.fill]="clothes().base" />
      }
    </g>

    <!-- arms and hands (same position in the three silhouettes); the shirt is short-sleeved -->
    <g data-layer="arms">
      <rect x="2" y="11" width="2" height="5" [attr.fill]="clothes().shadow" />
      <rect x="12" y="11" width="2" height="5" [attr.fill]="clothes().shadow" />
      @if (config().garment === 'tshirt') {
        <rect x="2" y="13" width="2" height="3" [attr.fill]="skin().base" />
        <rect x="12" y="13" width="2" height="3" [attr.fill]="skin().base" />
      }
      <rect x="2" y="16" width="2" height="1" [attr.fill]="skin().base" />
      <rect x="12" y="16" width="2" height="1" [attr.fill]="skin().base" />
      @if (config().gender === 'male') {
        <!-- broad shoulders: the top row of the torso extends over the arms -->
        <rect x="2" y="11" width="12" height="1" [attr.fill]="clothes().base" />
      }
    </g>

    <!-- garment details (the suit has none: it is the same plain jumpsuit as always) -->
    <g data-layer="garment">
      @switch (config().garment) {
        @case ('hoodie') {
          <!-- hood around the neck: the head and neck cover it in the center -->
          <rect x="3" y="9" width="10" height="2" [attr.fill]="clothes().shadow" />
          <rect x="6" y="11" width="1" height="1" fill="#F3EAFF" />
          <rect x="9" y="11" width="1" height="1" fill="#F3EAFF" />
          <rect x="4" y="16" width="8" height="1" [attr.fill]="clothes().shadow" />
        }
        @case ('tshirt') {
          <rect x="6" y="11" width="4" height="1" [attr.fill]="clothes().shadow" />
        }
        @case ('shirt') {
          <rect x="5" y="11" width="2" height="1" fill="#F3EAFF" />
          <rect x="9" y="11" width="2" height="1" fill="#F3EAFF" />
          <rect x="7" y="11" width="2" height="1" [attr.fill]="tie()" />
          <rect x="7" y="12" width="2" height="4" [attr.fill]="tie()" />
        }
        @case ('jacket') {
          <rect x="6" y="11" width="4" height="6" [attr.fill]="tshirt()" />
          <rect x="5" y="12" width="1" height="5" [attr.fill]="clothes().shadow" />
          <rect x="10" y="12" width="1" height="5" [attr.fill]="clothes().shadow" />
        }
      }
    </g>

    <!-- chest emblem: the rects inherit the group's fill -->
    @if (showEmblem()) {
      <g data-layer="emblem" [attr.fill]="emblemColor()" [attr.transform]="counterMirror()">
        @switch (config().emblem) {
          @case ('square') {
            <rect x="7" y="13" width="2" height="2" />
          }
          @case ('tag') {
            <rect x="6" y="12" width="1" height="1" />
            <rect x="5" y="13" width="1" height="1" />
            <rect x="6" y="14" width="1" height="1" />
            <rect x="8" y="12" width="1" height="2" />
            <rect x="7" y="14" width="1" height="1" />
            <rect x="9" y="12" width="1" height="1" />
            <rect x="10" y="13" width="1" height="1" />
            <rect x="9" y="14" width="1" height="1" />
          }
          @case ('braces') {
            <!-- Each brace is two arms toward the center and a tip pointing outward. It used
                 to be a vertical bar with a pixel at the side and it read as "⊣ ⊢". -->
            <rect x="6" y="12" width="2" height="1" />
            <rect x="5" y="13" width="1" height="1" />
            <rect x="6" y="14" width="2" height="1" />
            <rect x="9" y="12" width="2" height="1" />
            <rect x="11" y="13" width="1" height="1" />
            <rect x="9" y="14" width="2" height="1" />
          }
          @case ('prompt') {
            <rect x="5" y="12" width="1" height="1" />
            <rect x="6" y="13" width="1" height="1" />
            <rect x="5" y="14" width="1" height="1" />
            <rect x="8" y="14" width="3" height="1" />
          }
          @case ('lambda') {
            <rect x="6" y="12" width="2" height="1" />
            <rect x="7" y="13" width="1" height="1" />
            <rect x="6" y="14" width="1" height="1" />
            <rect x="8" y="14" width="1" height="1" />
          }
          @case ('semicolon') {
            <rect x="7" y="12" width="1" height="1" />
            <rect x="7" y="14" width="1" height="1" />
            <rect x="6" y="15" width="1" height="1" />
          }
          @case ('hash') {
            <rect x="6" y="12" width="1" height="4" />
            <rect x="8" y="12" width="1" height="4" />
            <rect x="5" y="13" width="5" height="1" />
            <rect x="5" y="15" width="5" height="1" />
          }
        }
      </g>
    }

    <!-- neck, head and features according to the silhouette -->
    <g data-layer="head">
      @if (config().gender === 'female') {
        <rect x="7" y="10" width="2" height="1" [attr.fill]="skin().shadow" />
        <rect x="4" y="3" width="8" height="6" [attr.fill]="skin().base" />
        <!-- rounded chin -->
        <rect x="5" y="9" width="6" height="1" [attr.fill]="skin().shadow" />
      } @else {
        <rect x="6" y="10" width="4" height="1" [attr.fill]="skin().shadow" />
        <rect x="4" y="3" width="8" height="7" [attr.fill]="skin().base" />
        <rect x="4" y="9" width="8" height="1" [attr.fill]="skin().shadow" />
      }
      <rect x="5" y="6" width="2" height="2" fill="#190236" />
      <rect x="9" y="6" width="2" height="2" fill="#190236" />
      <rect x="5" y="6" width="1" height="1" fill="#F3EAFF" />
      <rect x="9" y="6" width="1" height="1" fill="#F3EAFF" />
      @switch (config().gender) {
        @case ('female') {
          <g data-layer="eyelashes">
            <rect x="4" y="6" width="1" height="1" fill="#190236" />
            <rect x="11" y="6" width="1" height="1" fill="#190236" />
          </g>
          <rect x="7" y="8" width="2" height="1" fill="#E0567A" />
        }
        @case ('male') {
          <g data-layer="eyebrows">
            <rect x="5" y="5" width="2" height="1" [attr.fill]="hair().shadow" />
            <rect x="9" y="5" width="2" height="1" [attr.fill]="hair().shadow" />
          </g>
          <rect x="7" y="8" width="2" height="1" [attr.fill]="skin().shadow" />
        }
        @default {
          <rect x="7" y="8" width="2" height="1" [attr.fill]="skin().shadow" />
        }
      }
    </g>

    <!-- beard: hair-colored, below the hair -->
    @if (config().beard !== 'none') {
      <g data-layer="beard">
        @switch (config().beard) {
          @case ('beard') {
            <rect x="4" y="7" width="1" height="3" [attr.fill]="hair().shadow" />
            <rect x="11" y="7" width="1" height="3" [attr.fill]="hair().shadow" />
            <rect x="5" y="8" width="2" height="1" [attr.fill]="hair().base" />
            <rect x="9" y="8" width="2" height="1" [attr.fill]="hair().base" />
            <rect x="5" y="9" width="6" height="1" [attr.fill]="hair().base" />
          }
          @case ('mustache') {
            <rect x="6" y="8" width="4" height="1" [attr.fill]="hair().base" />
          }
          @case ('goatee') {
            <rect x="6" y="8" width="1" height="2" [attr.fill]="hair().base" />
            <rect x="9" y="8" width="1" height="2" [attr.fill]="hair().base" />
            <rect x="7" y="9" width="2" height="1" [attr.fill]="hair().base" />
          }
        }
      </g>
    }

    <!-- hair (the long hair and the ponytail peek out at the sides of the head) -->
    <g data-layer="hair">
      @switch (config().hair) {
        @case ('short') {
          <rect x="4" y="2" width="8" height="2" [attr.fill]="hair().base" />
          <rect x="4" y="4" width="1" height="2" [attr.fill]="hair().shadow" />
          <rect x="11" y="4" width="1" height="2" [attr.fill]="hair().shadow" />
        }
        @case ('long') {
          <rect x="4" y="2" width="8" height="2" [attr.fill]="hair().base" />
          <rect x="3" y="3" width="1" height="8" [attr.fill]="hair().base" />
          <rect x="12" y="3" width="1" height="8" [attr.fill]="hair().shadow" />
          <rect x="4" y="4" width="1" height="2" [attr.fill]="hair().shadow" />
          <rect x="11" y="4" width="1" height="2" [attr.fill]="hair().shadow" />
        }
        @case ('mohawk') {
          <rect x="7" y="0" width="2" height="3" [attr.fill]="hair().base" />
          <rect x="6" y="1" width="1" height="2" [attr.fill]="hair().shadow" />
          <rect x="9" y="1" width="1" height="2" [attr.fill]="hair().shadow" />
          <rect x="4" y="2" width="8" height="2" [attr.fill]="hair().shadow" />
        }
        @case ('shaved') {
          <rect x="4" y="2" width="8" height="1" [attr.fill]="hair().shadow" />
        }
        @case ('afro') {
          <rect x="3" y="1" width="10" height="3" [attr.fill]="hair().base" />
          <rect x="2" y="2" width="1" height="4" [attr.fill]="hair().shadow" />
          <rect x="13" y="2" width="1" height="4" [attr.fill]="hair().shadow" />
          <rect x="4" y="0" width="8" height="1" [attr.fill]="hair().base" />
        }
        @case ('bun') {
          <rect x="4" y="2" width="8" height="2" [attr.fill]="hair().base" />
          <rect x="6" y="0" width="4" height="2" [attr.fill]="hair().base" />
          <rect x="6" y="1" width="4" height="1" [attr.fill]="hair().shadow" />
          <rect x="4" y="4" width="1" height="1" [attr.fill]="hair().shadow" />
          <rect x="11" y="4" width="1" height="1" [attr.fill]="hair().shadow" />
        }
        @case ('ponytail') {
          <rect x="4" y="2" width="8" height="2" [attr.fill]="hair().base" />
          <rect x="4" y="4" width="1" height="1" [attr.fill]="hair().shadow" />
          <rect x="11" y="4" width="1" height="1" [attr.fill]="hair().shadow" />
          <rect x="12" y="3" width="2" height="2" [attr.fill]="hair().base" />
          <rect x="13" y="5" width="1" height="3" [attr.fill]="hair().base" />
          <rect x="13" y="8" width="1" height="1" [attr.fill]="hair().shadow" />
        }
        @case ('messy') {
          <rect x="4" y="2" width="8" height="2" [attr.fill]="hair().base" />
          <rect x="3" y="1" width="2" height="2" [attr.fill]="hair().base" />
          <rect x="6" y="1" width="2" height="1" [attr.fill]="hair().base" />
          <rect x="9" y="0" width="2" height="2" [attr.fill]="hair().base" />
          <rect x="12" y="2" width="1" height="2" [attr.fill]="hair().shadow" />
          <rect x="5" y="4" width="1" height="1" [attr.fill]="hair().base" />
          <rect x="8" y="4" width="2" height="1" [attr.fill]="hair().base" />
          <rect x="4" y="4" width="1" height="2" [attr.fill]="hair().shadow" />
          <rect x="11" y="4" width="1" height="2" [attr.fill]="hair().shadow" />
        }
      }
    </g>

    <!-- glasses: fixed colors; they are not drawn with a visor -->
    @if (showGlasses()) {
      <g data-layer="glasses">
        @switch (config().glasses) {
          @case ('thick-frame') {
            <rect x="4" y="5" width="8" height="1" fill="#190236" />
            <rect x="4" y="6" width="1" height="2" fill="#190236" />
            <rect x="7" y="6" width="2" height="1" fill="#190236" />
            <rect x="11" y="6" width="1" height="2" fill="#190236" />
          }
          @case ('round') {
            <rect x="5" y="5" width="2" height="1" fill="#B9A6D6" />
            <rect x="4" y="6" width="1" height="2" fill="#B9A6D6" />
            <rect x="5" y="8" width="2" height="1" fill="#B9A6D6" />
            <rect x="9" y="5" width="2" height="1" fill="#B9A6D6" />
            <rect x="11" y="6" width="1" height="2" fill="#B9A6D6" />
            <rect x="9" y="8" width="2" height="1" fill="#B9A6D6" />
            <rect x="7" y="6" width="2" height="1" fill="#B9A6D6" />
          }
          @case ('sunglasses') {
            <rect x="4" y="5" width="8" height="1" fill="#190236" />
            <rect x="4" y="6" width="3" height="2" fill="#0E0120" />
            <rect x="9" y="6" width="3" height="2" fill="#0E0120" />
            <rect x="7" y="6" width="2" height="1" fill="#190236" />
            <rect x="5" y="6" width="1" height="1" fill="#8B3DF5" />
            <rect x="10" y="6" width="1" height="1" fill="#8B3DF5" />
          }
          @case ('code') {
            <rect x="4" y="5" width="8" height="1" fill="#190236" />
            <rect x="4" y="6" width="1" height="2" fill="#190236" />
            <rect x="7" y="6" width="2" height="1" fill="#190236" />
            <rect x="11" y="6" width="1" height="2" fill="#190236" />
            <!-- reflection of code lines over the lenses -->
            <rect x="5" y="6" width="2" height="1" fill="#2BD46A" />
            <rect x="5" y="7" width="1" height="1" fill="#2BD46A" />
            <rect x="9" y="6" width="1" height="1" fill="#2BD46A" />
            <rect x="9" y="7" width="2" height="1" fill="#2BD46A" />
          }
        }
      </g>
    }

    <!-- head accessory: always above the hair. -->
    <g data-layer="accessory">
      @if (coversHead()) {
        <rect x="4" y="0" width="8" height="1" [attr.fill]="acc().base" />
        <rect x="3" y="1" width="10" height="2" [attr.fill]="acc().base" />
        <rect x="3" y="3" width="10" height="1" [attr.fill]="acc().shadow" />
      }
      @if (config().accessory === 'headphones' || config().accessory === 'headset') {
        <rect x="4" y="0" width="8" height="1" [attr.fill]="acc().base" />
        <rect x="2" y="1" width="2" height="1" [attr.fill]="acc().base" />
        <rect x="12" y="1" width="2" height="1" [attr.fill]="acc().base" />
        <rect x="2" y="2" width="2" height="5" [attr.fill]="acc().base" />
        <rect x="12" y="2" width="2" height="5" [attr.fill]="acc().shadow" />
      }
      @switch (config().accessory) {
        @case ('visor') {
          <rect x="3" y="5" width="10" height="3" [attr.fill]="acc().base" opacity="0.85" />
          <rect x="3" y="5" width="10" height="1" [attr.fill]="acc().shadow" />
        }
        @case ('cap') {
          <rect x="0" y="3" width="4" height="1" [attr.fill]="acc().base" />
        }
        @case ('backwards-cap') {
          <!-- fit opening and visor peeking out from behind -->
          <rect x="7" y="2" width="2" height="1" [attr.fill]="acc().shadow" />
          <rect x="12" y="2" width="3" height="1" [attr.fill]="acc().shadow" />
        }
        @case ('beanie') {
          <!-- ribbed fabric -->
          <rect x="5" y="1" width="1" height="2" [attr.fill]="acc().shadow" />
          <rect x="8" y="1" width="1" height="2" [attr.fill]="acc().shadow" />
          <rect x="11" y="1" width="1" height="2" [attr.fill]="acc().shadow" />
        }
        @case ('crown') {
          <rect x="4" y="0" width="2" height="2" [attr.fill]="acc().base" />
          <rect x="7" y="0" width="2" height="2" [attr.fill]="acc().base" />
          <rect x="10" y="0" width="2" height="2" [attr.fill]="acc().base" />
          <rect x="4" y="2" width="8" height="1" [attr.fill]="acc().shadow" />
        }
        @case ('headset') {
          <!-- microphone: arm from the earpiece to the mouth -->
          <rect x="3" y="7" width="1" height="1" [attr.fill]="acc().shadow" />
          <rect x="4" y="8" width="2" height="1" [attr.fill]="acc().shadow" />
          <rect x="6" y="8" width="1" height="1" fill="#190236" />
        }
      }
    </g>

    <!-- held object: fixed colors, in front of everything. The laptop is held in front
         of the chest with both hands; coffee and mate in the right hand; the keyboard against the
         left side. -->
    @if (config().object !== 'none') {
      <g data-layer="object">
        @switch (config().object) {
          @case ('laptop') {
            <rect x="4" y="12" width="8" height="5" fill="#4B4A57" />
            <rect x="4" y="16" width="8" height="1" fill="#2B2A35" />
            <!-- stickers on the lid -->
            <rect x="5" y="13" width="2" height="2" fill="#FF2758" />
            <rect x="9" y="14" width="2" height="1" fill="#2BD46A" />
            <rect x="8" y="12" width="1" height="1" fill="#F3EAFF" />
          }
          @case ('coffee') {
            <rect x="13" y="14" width="3" height="3" fill="#F3EAFF" />
            <rect x="13" y="14" width="3" height="1" fill="#6B4226" />
            <rect x="15" y="15" width="1" height="2" fill="#B9A6D6" />
            <!-- steam -->
            <rect x="14" y="12" width="1" height="1" fill="#B9A6D6" />
            <rect x="13" y="11" width="1" height="1" fill="#B9A6D6" />
          }
          @case ('mate') {
            <rect x="13" y="14" width="3" height="3" fill="#6B4226" />
            <rect x="13" y="14" width="3" height="1" fill="#8A5A36" />
            <rect x="14" y="14" width="1" height="1" fill="#4F8A2B" />
            <!-- straw -->
            <rect x="15" y="11" width="1" height="3" fill="#CFCAD6" />
          }
          @case ('keyboard') {
            <rect x="0" y="14" width="6" height="2" fill="#4B4A57" />
            <rect x="0" y="14" width="1" height="1" fill="#F3EAFF" />
            <rect x="2" y="14" width="1" height="1" fill="#F3EAFF" />
            <rect x="4" y="14" width="1" height="1" fill="#F3EAFF" />
            <rect x="1" y="15" width="1" height="1" fill="#FF2758" />
          }
        }
      </g>
    }
  </svg>
</span>
