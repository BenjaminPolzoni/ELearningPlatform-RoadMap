@if (auth.rol()) {
  <header class="navbar bg-base-200 border-b-2 border-primary px-4 gap-3">
    <a routerLink="/" class="text-primary title-font text-xs">ROADMAP</a>
    <span class="badge badge-secondary badge-outline ui-font">{{ auth.rol() }}</span>

    @if (auth.rol() === 'PROFESOR') {
      <a routerLink="/profesor" routerLinkActive="text-primary" class="btn btn-sm btn-ghost">Editor</a>
      <a routerLink="/alumno" routerLinkActive="text-primary" class="btn btn-sm btn-ghost">Ver mapa</a>
    }
    @if (auth.rol() === 'ALUMNO') {
      <a routerLink="/alumno" routerLinkActive="text-primary" class="btn btn-sm btn-ghost">Mi mapa</a>
    }

    <div class="flex-1"></div>
    <button class="btn btn-sm btn-ghost" (click)="theme.toggle()">
      {{ theme.tema() === 'arcade-dark' ? '☀ claro' : '☾ oscuro' }}
    </button>
    <button class="btn btn-sm btn-outline btn-error" (click)="salir()">salir</button>
  </header>

  <!-- Botón "HI-RANKING" del ranking de la cohorte (E8). Visible con sesión; el panel se adapta al rol. -->
  <app-ranking-trigger />
}

<main class="p-6 max-w-6xl mx-auto">
  <router-outlet />
</main>

@if (!esDesktop()) {
  <div class="fixed inset-0 z-50 bg-base-100 flex items-center justify-center p-8 text-center">
    <div>
      <p class="text-accent title-font text-base leading-loose">Esta sección requiere una computadora</p>
      <p class="mt-4 opacity-70">RF-NFR-05 — el editor y el mapa no funcionan en pantallas chicas.</p>
    </div>
  </div>
}
