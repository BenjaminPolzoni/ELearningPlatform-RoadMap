<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Avatar Preview</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #161328;
      overflow: hidden;
    }
    canvas {
      display: block;
    }
    #rotate-hint {
      position: fixed;
      left: 50%;
      bottom: 10px;
      transform: translateX(-50%);
      font: 12px system-ui, sans-serif;
      color: #cfc6ec;
      background: rgba(10, 6, 24, 0.55);
      border: 1px solid rgba(139, 92, 246, 0.4);
      border-radius: 999px;
      padding: 4px 12px;
      pointer-events: none;
      white-space: nowrap;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="rotate-hint">🖱️ arrastrá para rotar · rueda para zoom</div>
  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import {
      remapSkinnedMesh,
      splitLegGeometry,
      applyShoesTint,
      isHeadMesh,
      extractFaceGeometry,
      createAvatarMounter,
    } from './avatar-modular-core.js';

    const DEFAULT_CONFIG = {
      characterClass: 'Knight',
      headStyle: 'Knight',
      hairStyle: 'default',
      hairColor: '#ffffff',
      beardStyle: 'none',
      beardColor: '#ffffff',
      topStyle: 'Knight',
      pantsStyle: 'Knight',
      shoesStyle: 'Knight',
      shoesColor: '#ffffff',
      showCape: true,
      backItem: 'backpack',
      backpackColor: '#2563eb',
      headItem: 'headphones',
      pet: 'drone',
      rightHandItem: 'mouse_gamer',
      leftHandItem: 'mate_argentino'
    };

    function leerConfig() {
      try {
        const saved = localStorage.getItem('modular_character_config');
        if (saved) {
          const parsed = JSON.parse(saved);
          if (parsed && typeof parsed === 'object') {
            const config = Object.assign({}, DEFAULT_CONFIG, parsed);
            const validClasses = ['Knight', 'Barbarian', 'Mage', 'Ranger', 'Rogue', 'Skeleton_Warrior', 'Skeleton_Mage', 'Skeleton_Rogue', 'Skeleton_Minion', 'Mannequin'];
            if (config.characterClass === 'Rogue_Hooded') {
              if (!parsed.topStyle) config.topStyle = 'Rogue_Hooded';
              config.characterClass = 'Rogue';
            }
            if (config.headStyle === 'Rogue_Hooded') config.headStyle = 'Rogue';
            if (!config.characterClass || !validClasses.includes(config.characterClass)) {
              config.characterClass = 'Knight';
            }
            if (!config.headStyle) config.headStyle = config.characterClass || 'Knight';
            if (!config.hairStyle) config.hairStyle = 'default';
            if (!config.beardStyle) {
              if (config.characterClass === 'Barbarian') config.beardStyle = 'long';
              else if (config.characterClass === 'Ranger') config.beardStyle = 'short';
              else config.beardStyle = 'none';
            }
            if (!config.topStyle) config.topStyle = config.characterClass || 'Knight';
            if (!config.pantsStyle) config.pantsStyle = config.characterClass || 'Knight';
            if (!config.shoesStyle) config.shoesStyle = config.characterClass || 'Knight';
            if (!config.shoesColor) config.shoesColor = '#ffffff';


            if (config.showCape === undefined) config.showCape = (config.backItem === 'cape');
            if (!config.backItem) {
              config.backItem = config.showCape ? 'cape' : 'backpack';
            }
            if (config.backItem === 'quiver' || config.backItem === 'Skeleton_Quiver.gltf') {
              config.backItem = 'shield_badge.gltf';
            }
            if (!config.backpackColor) config.backpackColor = '#2563eb';
            if (!config.headItem) {
              if (config.showHelmet) config.headItem = 'helmet';
              else if (config.showHat) config.headItem = 'bear_hat';
              else config.headItem = 'headphones';
            }
            if (!config.pet) config.pet = 'drone';
            if (config.rightHandItem === undefined) config.rightHandItem = 'mouse_gamer';
            if (config.leftHandItem === undefined) config.leftHandItem = 'mate_argentino';
            if (config.rightHandItem && config.rightHandItem.includes('spellbook')) {
              config.rightHandItem = 'keyboard_gamer';
            }
            if (config.leftHandItem && config.leftHandItem.includes('spellbook')) {
              config.leftHandItem = 'keyboard_gamer';
            }
            return config;
          }
        }
      } catch (e) {
        console.warn('Could not read modular_character_config:', e);
      }
      return DEFAULT_CONFIG;
    }

    const FONDO_TARJETA = 0x161328;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(FONDO_TARJETA);
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 20);
    camera.position.set(0, 0.52, 1.36);
    camera.lookAt(0, 0.38, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);

    // Manual character rotation (drag) + zoom (wheel). No panning so as
    // not to lose the framing; it also benefits the login preview (same file).
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 0.38, 0);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.enablePan = false;
    controls.minDistance = 0.7;
    controls.maxDistance = 3.5;
    controls.minPolarAngle = 0.35;
    controls.maxPolarAngle = Math.PI / 2 + 0.15;
    controls.update();

    scene.add(new THREE.AmbientLight(0xffffff, 0.9));
    const key = new THREE.DirectionalLight(0xfff2e0, 1.2);
    key.position.set(1.5, 3, 2);
    scene.add(key);
    const rim = new THREE.DirectionalLight(0x8b3df5, 0.8);
    rim.position.set(-2, 1.5, -1.5);
    scene.add(rim);

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // -------------------------------------------------------------
    // MODULAR CHARACTER SYSTEM & RETARGETING ENGINE
    // -------------------------------------------------------------
    const gltfCache = new Map();

    async function getGLTF(className) {
      if (gltfCache.has(className)) return gltfCache.get(className);
      const url = 'Assets/CharacterV2/Characters/gltf/' + className + '.glb';
      const gltf = await new Promise((res, rej) => loader.load(url, res, undefined, rej));
      gltfCache.set(className, gltf);
      return gltf;
    }

    const { mountHair, mountBeard, mountMask } = createAvatarMounter(getGLTF);

    async function applyModularParts(targetModel, config) {
      const targetRig = targetModel.getObjectByName('Rig_Medium') || targetModel.getObjectByName('Rig');
      let targetSkin = null;
      targetModel.traverse(c => {
        if (c.isSkinnedMesh && !targetSkin) targetSkin = c;
      });
      if (!targetRig || !targetSkin) return;

      // 1. Clear previous modular pieces
      const toRemove = [];
      targetRig.children.forEach(c => {
        if (c.name && c.name.startsWith('modular_')) toRemove.push(c);
      });
      toRemove.forEach(c => targetRig.remove(c));

      const headBone = targetModel.getObjectByName('head');
      if (headBone) {
        const headToRemove = [];
        headBone.children.forEach(c => {
          if (c.name && c.name.startsWith('modular_')) headToRemove.push(c);
        });
        headToRemove.forEach(c => headBone.remove(c));
      }

      // 2. Hide the original base meshes of head and legs
      targetModel.traverse(c => {
        if (c.isMesh) {
          if (isHeadMesh(c.name)) {
            c.visible = false;
          }
          if (c.name.includes('Leg')) c.visible = false;
        }
      });

      // 3. Mount Modular Head, Hair and Face cosmetic (beard or face mask)
      const headClass = config.headStyle || config.characterClass || 'Knight';
      const beardType = config.beardStyle !== undefined ? config.beardStyle : (headClass === 'Barbarian' ? 'long' : (headClass === 'Ranger' ? 'short' : 'none'));
      const hairType = config.hairStyle || 'default';

      let effectiveHeadClass = headClass;
      let shouldMountSeparateBeard = false;
      const wantMask = (beardType === 'mask');
      const isHoodedNative = (headClass === 'Rogue_Hooded');
      let shouldMountMask = (wantMask && !isHoodedNative);

      if (wantMask) {
        effectiveHeadClass = headClass;
        shouldMountSeparateBeard = false;
      } else if (headClass === 'Barbarian') {
        if (beardType === 'long') {
          effectiveHeadClass = 'Barbarian';
          // Also separated as native: so that beardColor reaches it (baked ones cannot be dyed).
          shouldMountSeparateBeard = true;
        } else {
          effectiveHeadClass = 'Knight';
          shouldMountSeparateBeard = (beardType === 'short');
        }
      } else if (headClass === 'Ranger') {
        if (beardType === 'short') {
          effectiveHeadClass = 'Ranger';
          shouldMountSeparateBeard = true;
        } else {
          effectiveHeadClass = 'Knight';
          shouldMountSeparateBeard = (beardType === 'long');
        }
      } else {
        effectiveHeadClass = headClass;
        shouldMountSeparateBeard = (beardType === 'long' || beardType === 'short');
      }

      // Default hair with dye: its own native hair is mounted so it receives the
      // color (baked cannot be dyed). Without dye, on bald or non-human, same as before.
      const dyesHair = (config.hairColor || '#ffffff').toLowerCase() !== '#ffffff';
      const ownHairDyes = hairType === 'default' && dyesHair &&
        ['Knight', 'Mage', 'Ranger', 'Rogue'].includes(effectiveHeadClass);
      const effectiveHairType = ownHairDyes ? effectiveHeadClass.toLowerCase() : hairType;

      // The bangs and own eyebrows are removed with any foreign hair that brings its own hair/eyebrows:
      // the forehead is covered by the donor's full strip with its eyebrows + the stretchesFront.
      const stylesWithHair = ['mage', 'ranger', 'knight', 'rogue'];
      const withoutBangs = stylesWithHair.includes(effectiveHairType) &&
        effectiveHairType !== effectiveHeadClass.toLowerCase();
      // Forehead stretched in every foreign combo to reach the helmet (see
      // extractFaceGeometry: the eyes go by UV and do not move).
      const stretchesFront = effectiveHairType !== 'default';

      const headGltf = await getGLTF(effectiveHeadClass);
      if (headGltf) {
        if (effectiveHeadClass === 'Rogue_Hooded') {
          const origHead = headGltf.scene.getObjectByName('RogueHooded_Head');
          if (origHead) {
            const remappedHead = remapSkinnedMesh(origHead, targetSkin.skeleton);
            remappedHead.name = 'modular_head';
            targetRig.add(remappedHead);
          }
          const origMask = headGltf.scene.getObjectByName('RogueHooded_Mask');
          if (origMask) {
            const remappedMask = remapSkinnedMesh(origMask, targetSkin.skeleton);
            remappedMask.name = 'modular_head_mask';
            targetRig.add(remappedMask);
          }
        } else if (effectiveHeadClass === 'Mannequin') {
          const origHead = headGltf.scene.getObjectByName('Mannequin_Medium_Head');
          if (origHead) {
            const remappedHead = remapSkinnedMesh(origHead, targetSkin.skeleton);
            remappedHead.name = 'modular_head';

            // Mannequin head with proportional adjustment (scale 0.87, +7% over 0.80) with pivot at the base of the neck
            const pos = remappedHead.geometry.attributes.position;
            const pivotY = 1.2414;
            const scale = 0.87;
            for (let i = 0; i < pos.count; i++) {
              pos.setX(i, pos.getX(i) * scale);
              pos.setY(i, pivotY + (pos.getY(i) - pivotY) * scale);
              pos.setZ(i, pos.getZ(i) * scale);
            }
            pos.needsUpdate = true;
            remappedHead.geometry.computeVertexNormals();
            remappedHead.geometry.computeBoundingBox();
            remappedHead.geometry.computeBoundingSphere();

            targetRig.add(remappedHead);
          }
        } else if (effectiveHeadClass.startsWith('Skeleton_')) {
          let skullName = `${effectiveHeadClass}_Head`;
          if (effectiveHeadClass === 'Skeleton_Mage') skullName = 'Skeleton_Mage_Skull';

          const headParts = [skullName, `${effectiveHeadClass}_Jaw`, `${effectiveHeadClass}_Eyes`];
          headParts.forEach((partName, idx) => {
            const origPart = headGltf.scene.getObjectByName(partName);
            if (origPart) {
              const remappedPart = remapSkinnedMesh(origPart, targetSkin.skeleton);
              remappedPart.name = `modular_head_part_${idx}`;
              targetRig.add(remappedPart);
            }
          });

          // Innate head accessory (Skeleton Helmet/Hat/Hood)
          let innateHatName = null;
          if (effectiveHeadClass === 'Skeleton_Warrior') innateHatName = 'Skeleton_Warrior_Helmet';
          else if (effectiveHeadClass === 'Skeleton_Mage') innateHatName = 'Skeleton_Mage_Hat';
          else if (effectiveHeadClass === 'Skeleton_Rogue') innateHatName = 'Skeleton_Rogue_Hood';

          if (innateHatName && headBone) {
            const origHat = headGltf.scene.getObjectByName(innateHatName);
            if (origHat) {
              const clonedHat = origHat.clone();
              clonedHat.name = 'modular_head_hat';
              clonedHat.visible = (!config.headItem || config.headItem === 'none');
              if (innateHatName === 'Skeleton_Rogue_Hood') clonedHat.scale.multiplyScalar(1.15);
              headBone.add(clonedHat);
            }
          }
        } else {
          const origHead = headGltf.scene.getObjectByName(`${effectiveHeadClass}_Head`);
          if (origHead) {
            const headMesh = origHead.clone();
            const isHumanHead = ['Knight', 'Barbarian', 'Mage', 'Ranger', 'Rogue'].includes(effectiveHeadClass);
            if (isHumanHead && effectiveHairType !== 'default') {
              // Always separated (the mesh covers the chin); a baked one would not receive the color.
              const keepBeard = false;
              headMesh.geometry = extractFaceGeometry(origHead, effectiveHeadClass, keepBeard, withoutBangs, stretchesFront);
            }
            const remappedHead = remapSkinnedMesh(headMesh, targetSkin.skeleton);
            remappedHead.name = 'modular_head';
            targetRig.add(remappedHead);
          }
        }
      }

      // Mount modular hair if applicable
      if (effectiveHairType !== 'default') {
        await mountHair(targetRig, targetSkin, effectiveHairType, effectiveHeadClass, withoutBangs, config.hairColor || '#ffffff');
      }

      // Mount modular face cosmetic if applicable (beard or face mask)
      if (shouldMountSeparateBeard) {
        await mountBeard(targetRig, targetSkin, beardType, config.beardColor || '#ffffff');
      }
      if (shouldMountMask) {
        await mountMask(targetRig, targetSkin, config.beardColor || '#ffffff');
      }

      // 4. Mount Modular Pants
      const pantsClass = config.pantsStyle || config.characterClass || 'Knight';
      const pantsGltf = await getGLTF(pantsClass);
      if (pantsGltf) {
        for (const side of ['Left', 'Right']) {
          let legName = `${pantsClass}_Leg${side}`;
          if (pantsClass === 'Rogue_Hooded') legName = `RogueHooded_Leg${side}`;
          if (pantsClass === 'Mannequin') legName = `Mannequin_Medium_Leg${side}`;
          const origLeg = pantsGltf.scene.getObjectByName(legName);
          if (origLeg) {
            const { pantsGeom } = splitLegGeometry(origLeg, 0.15);
            const pMesh = origLeg.clone();
            pMesh.geometry = pantsGeom;
            const remappedPants = remapSkinnedMesh(pMesh, targetSkin.skeleton);
            remappedPants.name = `modular_pants_${side.toLowerCase()}`;
            targetRig.add(remappedPants);
          }
        }
      }

      // 5. Mount Modular Shoes
      const isSneakers = (config.shoesStyle === 'sneakers');
      const shoesClass = isSneakers ? 'Rogue' : (config.shoesStyle || config.characterClass || 'Knight');
      const shoesGltf = await getGLTF(shoesClass);
      if (shoesGltf) {
        for (const side of ['Left', 'Right']) {
          let legName = `${shoesClass}_Leg${side}`;
          if (shoesClass === 'Rogue_Hooded') legName = `RogueHooded_Leg${side}`;
          if (shoesClass === 'Mannequin') legName = `Mannequin_Medium_Leg${side}`;
          const origLeg = shoesGltf.scene.getObjectByName(legName);
          if (origLeg) {
            const { shoesGeom } = splitLegGeometry(origLeg, 0.15);
            const sMesh = origLeg.clone();
            sMesh.geometry = shoesGeom;
            const remappedShoes = remapSkinnedMesh(sMesh, targetSkin.skeleton);
            remappedShoes.name = `modular_shoes_${side.toLowerCase()}`;
            if (isSneakers || config.shoesColor) {
              applyShoesTint(remappedShoes, config.shoesColor || '#ffffff');
            }
            targetRig.add(remappedShoes);
          }
        }
      }
    }

    // -------------------------------------------------------------
    // COSMETICS & WEAPONS MANAGEMENT
    // -------------------------------------------------------------
    const sharedHatCache = new Map();

    async function getSharedHat(type, targetModel) {
      const targetRig = targetModel.getObjectByName('Rig_Medium') || targetModel.getObjectByName('Rig');
      let targetSkin = null;
      targetModel.traverse((c) => {
        if (c.isSkinnedMesh && !targetSkin) targetSkin = c;
      });
      if (!targetRig || !targetSkin) return null;

      const scaleMeshGeom = (mesh, s, originY, originZ) => {
        const g = mesh.geometry.clone();
        const pos = g.attributes.position;
        for (let i = 0; i < pos.count; i++) {
          pos.setXYZ(
            i,
            pos.getX(i) * s,
            originY + (pos.getY(i) - originY) * s,
            originZ + (pos.getZ(i) - originZ) * s
          );
        }
        pos.needsUpdate = true;
        g.computeVertexNormals();
        const cloned = mesh.clone();
        cloned.geometry = g;
        return cloned;
      };

      if (type === 'helmet') {
        if (!sharedHatCache.has('helmet')) {
          const gltf = await getGLTF('Knight');
          const hMesh = gltf.scene.getObjectByName('Knight_Helmet');
          const vMesh = gltf.scene.getObjectByName('Knight_HelmetVisor');
          // Helmet 10% bigger (s = 1.10)
          sharedHatCache.set('helmet', {
            hMesh: scaleMeshGeom(hMesh, 1.10, 1.68, 0.04),
            vMesh: scaleMeshGeom(vMesh, 1.10, 1.68, 0.04)
          });
        }
        const { hMesh, vMesh } = sharedHatCache.get('helmet');
        const group = new THREE.Group();
        group.name = 'custom_shared_hat';
        const cH = remapSkinnedMesh(hMesh, targetSkin.skeleton);
        const cV = remapSkinnedMesh(vMesh, targetSkin.skeleton);
        group.add(cH);
        group.add(cV);
        return group;
      } else if (type === 'bear_hat') {
        if (!sharedHatCache.has('bear_hat')) {
          const gltf = await getGLTF('Barbarian');
          const bMesh = gltf.scene.getObjectByName('Barbarian_BearHat');
          // Bear hat 15% bigger (s = 1.15)
          sharedHatCache.set('bear_hat', {
            bMesh: scaleMeshGeom(bMesh, 1.15, 1.72, 0.05)
          });
        }
        const { bMesh } = sharedHatCache.get('bear_hat');
        const group = new THREE.Group();
        group.name = 'custom_shared_hat';
        const cB = remapSkinnedMesh(bMesh, targetSkin.skeleton);
        group.add(cB);
        return group;
      }
      return null;
    }

    function applyCosmetics(model, config) {
      if (!model) return;

      // Clear the previous shared hat/helmet if there was one
      const targetRig = model.getObjectByName('Rig_Medium') || model.getObjectByName('Rig');
      if (targetRig) {
        const oldShared = targetRig.getObjectByName('custom_shared_hat');
        if (oldShared) targetRig.remove(oldShared);
      }

      // 1. Visibility of glTF base meshes (helmet and bear hat always go through getSharedHat scaled)
      model.traverse((child) => {
        if (child.isMesh && !child.name.startsWith('modular_')) {
          const name = child.name;
          if (name.includes('Cape') || name.includes('Cloak')) {
            child.visible = (config.backItem === 'cape');
          } else if (isHeadMesh(name)) {
            child.visible = false;
          }
        }
      });

      // If helmet (+10%) or bear hat (+15%) was chosen, link the scaled version
      if (config.headItem === 'helmet' || config.headItem === 'bear_hat') {
        const requestedItem = config.headItem;
        const isMannequinHead = (config.headStyle === 'Mannequin' || (!config.headStyle && config.characterClass === 'Mannequin'));
        getSharedHat(requestedItem, model).then((sharedHat) => {
          if (sharedHat && config.headItem === requestedItem) {
            const currentRig = model.getObjectByName('Rig_Medium') || model.getObjectByName('Rig');
            if (currentRig) {
              const old = currentRig.getObjectByName('custom_shared_hat');
              if (old) currentRig.remove(old);
              if (isMannequinHead) sharedHat.scale.multiplyScalar(0.87);
              currentRig.add(sharedHat);
            }
          }
        });
      }

      const chestBone = model.getObjectByName('chest');
      if (chestBone) {
        const oldBack = chestBone.getObjectByName('custom_back_item');
        if (oldBack) chestBone.remove(oldBack);

        let backObj = null;
        if (config.backItem === 'backpack') {
          backObj = createBackpack(config.backpackColor || '#2563eb');
          backObj.position.set(0, 0.04, -0.28);
        } else if (config.backItem === 'keyboard_back') {
          backObj = createKeyboardBack(createGamerKeyboard);
          backObj.position.set(0, 0.05, -0.26);
          activeRGBObjects.add(backObj);
        } else if (config.backItem === 'giant_usb' || config.backItem === 'giant_keychain') {
          backObj = createGiantUSB();
          backObj.position.set(0, 0.05, -0.22);
        } else if (typeof config.backItem === 'string' && config.backItem.endsWith('.gltf')) {
          const reqBack = config.backItem;
          loadWeapon(reqBack).then(bObj => {
            if (bObj && config.backItem === reqBack) {
              bObj.name = 'custom_back_item';
              bObj.position.set(0, -0.08, -0.45);
              bObj.rotation.set(0, Math.PI, 0);
              const curChest = model.getObjectByName('chest');
              if (curChest) {
                const old = curChest.getObjectByName('custom_back_item');
                if (old) curChest.remove(old);
                curChest.add(bObj);
              }
            }
          });
        } else if (config.backItem === 'guitar') {
          // The gltf files come crossed (guitar_A is blue, guitar_B is pink): the mapping is inverted.
          const gVar = config.guitarColor === 'B' ? 'A' : 'B';
          loadMixedGltf('guitar_' + gVar + '.gltf').then(gScene => {
            if (gScene && config.backItem === 'guitar') {
              const gObj = placeGuitar(gScene, gVar);
              const curChest = model.getObjectByName('chest');
              if (curChest) {
                const old = curChest.getObjectByName('custom_back_item');
                if (old) curChest.remove(old);
                curChest.add(gObj);
              }
            }
          });
        }

        if (backObj) {
          backObj.name = 'custom_back_item';
          chestBone.add(backObj);
        }
      }

      const headBone = model.getObjectByName('head');
      if (headBone) {
        const oldHead = headBone.getObjectByName('custom_head_item');
        if (oldHead) headBone.remove(oldHead);

        const innateHat = headBone.getObjectByName('modular_head_hat');
        if (innateHat) {
          innateHat.visible = (!config.headItem || config.headItem === 'none');
        }

        let headObj = null;
        if (config.headItem === 'headphones') {
          headObj = createGamerHeadphones();
          headObj.position.set(0, 0, 0);
          activeRGBObjects.add(headObj);
        } else if (config.headItem === 'propeller_hat') {
          headObj = createPropellerHat();
          // +0.10 to compensate the vertical squash (it pivots at the origin):
          // the hat's base stays at the same height, only the object is lower.

    function createPropellerHat() {
      const group = new THREE.Group();
      group.name = 'propeller_hat';

      // 4 classic primary-color gores for the copter cap

      // 1. Dome raised on the head (Y = 0.49) and more enveloping (phiLength = 0.54 * PI) to fully cover the skull
      const capRadius = 0.57;
      const capY = 0.49;
      const capZ = 0.01;

      const quarters = [
        { mat: redMat, start: 0 },
        { mat: blueMat, start: Math.PI * 0.5 },
        { mat: yellowMat, start: Math.PI },
        { mat: greenMat, start: Math.PI * 1.5 }
      ];
      quarters.forEach(q => {
        const segGeom = new THREE.SphereGeometry(capRadius, 18, 14, q.start, Math.PI * 0.5, 0, Math.PI * 0.54);
        const segMesh = new THREE.Mesh(segGeom, q.mat);
        segMesh.position.set(0, capY, capZ);
        group.add(segMesh);
      });

      // 2. Upper base washer where the shaft starts
      const baseGrommet = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.07, 0.04, 16), metalMat);
      baseGrommet.position.set(0, capY + capRadius - 0.01, capZ);
      group.add(baseGrommet);

      // Vertical metallic shaft
      const shaft = new THREE.Mesh(new THREE.CylinderGeometry(0.012, 0.012, 0.16, 12), metalMat);
      shaft.position.set(0, capY + capRadius + 0.08, capZ);
      group.add(shaft);

      // Rotating propeller group
      const propGroup = new THREE.Group();
      propGroup.position.set(0, capY + capRadius + 0.16, capZ);

      // Central core / hub
      const hub = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 0.03, 14), yellowMat);
      propGroup.add(hub);

      const topBead = new THREE.Mesh(new THREE.SphereGeometry(0.03, 12, 12), orangeMat);
      topBead.position.set(0, 0.025, 0);
      propGroup.add(topBead);

      // Propeller blades (2 elongated aerodynamic blades with slight tilt and red tips)
      const bladeGeom = new THREE.BoxGeometry(0.28, 0.012, 0.065);
      const bladeMat = new THREE.MeshStandardMaterial({ color: 0xfacc15, roughness: 0.3 });
      const tipMat = new THREE.MeshStandardMaterial({ color: 0xef4444, roughness: 0.4 });

      // Blade 1
      const blade1 = new THREE.Mesh(bladeGeom, bladeMat);
      blade1.position.set(0.16, 0, 0);
      blade1.rotation.x = 0.18;
      propGroup.add(blade1);

      const tip1 = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.014, 0.065), tipMat);
      tip1.position.set(0.28, 0, 0);
      tip1.rotation.x = 0.18;
      propGroup.add(tip1);

      // Blade 2
      const blade2 = new THREE.Mesh(bladeGeom, bladeMat);
      blade2.position.set(-0.16, 0, 0);
      blade2.rotation.x = -0.18;
      propGroup.add(blade2);

      const tip2 = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.014, 0.065), tipMat);
      tip2.position.set(-0.28, 0, 0);
      tip2.rotation.x = -0.18;
      propGroup.add(tip2);

      group.add(propGroup);

      // Continuous propeller spin at 60 FPS
      group.userData.updateRGB = (time) => {
        propGroup.rotation.y = time * 24;
      };

      // Hat 20% smaller and with 30% less height (vertical squash)
      group.scale.set(0.8, 0.56, 0.8);

      return group;
    }

    // KayKit little stars orbiting the head: 7 copies of the gltf of the chosen color.
    const starOrbitCache = new Map();

    function createStarOrbit(color = 'yellow') {
      const group = new THREE.Group();
      group.name = 'star_orbit_' + color;

      // 7 equidistant supports: the orbit is animated in updateRGB even if the gltf is still loading.
      const COUNT = 7;
      const RADIUS = 0.55;
      const HEIGHT = 1.05;
      const holders = [];
      for (let i = 0; i < COUNT; i++) {
        const holder = new THREE.Group();
        group.add(holder);
        holders.push(holder);
      }

      group.userData.updateRGB = (time) => {
        for (let i = 0; i < holders.length; i++) {
          const a = time * 1.8 + (i / holders.length) * Math.PI * 2;
          holders[i].position.set(
            Math.cos(a) * RADIUS,
            HEIGHT + Math.sin(time * 3 + i * 1.3) * 0.05,
            Math.sin(a) * RADIUS
          );
          const star = holders[i].children[0];
          if (star) star.rotation.y = time * 3 + i;
        }
      };

      const place = (scene) => {
        scene.traverse((c) => {
          if (c.isMesh) c.castShadow = true;
        });
        holders.forEach((holder) => {
          if (holder.children.length) return;
          const clone = scene.clone(true);
          clone.scale.setScalar(0.3);
          holder.add(clone);
        });
      };

      const file = 'star_' + color + '.gltf';
      if (starOrbitCache.has(color)) {
        place(starOrbitCache.get(color));
      } else {
        loader.load('Assets/Cosmetics/stars/' + file, (gltf) => {
          starOrbitCache.set(color, gltf.scene);
          place(gltf.scene);
        }, undefined, (err) => {
          console.warn('Could not load the star:', file, err);
        });
      }

      return group;
    }

    // -------------------------------------------------------------
    // MIXED BAG (KayKit): gltfs in Assets/Cosmetics/mixed/ with shared cache.
    // -------------------------------------------------------------
    const mixedGltfCache = new Map();

    function loadMixedGltf(fileName) {
      if (mixedGltfCache.has(fileName)) return Promise.resolve(mixedGltfCache.get(fileName));
      return new Promise((resolve) => {
        loader.load('Assets/Cosmetics/mixed/' + fileName, (gltf) => {
          gltf.scene.traverse((c) => {
            if (c.isMesh) c.castShadow = true;
          });
          mixedGltfCache.set(fileName, gltf.scene);
          resolve(gltf.scene);
        }, undefined, (err) => {
          console.warn('Could not load the cosmetic:', fileName, err);
          resolve(null);
        });
      });
    }

    // Two flowers as antennae tilted outward, with gentle swaying.
    function createFlowerAntennae() {
      const group = new THREE.Group();
      group.name = 'flower_antennae';

      const files = ['flax_flower_A.gltf', 'flax_flower_B.gltf'];
      const spots = [
        { x: -0.3, tilt: 0.35 },
        { x: 0.3, tilt: -0.35 },
      ];
      group.userData.updateRGB = (time) => {
        group.rotation.z = Math.sin(time * 1.6) * 0.04;
      };

      files.forEach((file, i) => {
        loadMixedGltf(file).then((scene) => {
          if (!scene || group.children.length >= files.length) return;
          const f = scene.clone(true);
          f.scale.setScalar(0.35);
          f.position.set(spots[i].x, 0.86, 0.12);
          f.rotation.z = spots[i].tilt;
          group.add(f);
        });
      });

      return group;
    }

    function createGamingMouse() {
      const group = new THREE.Group();
      group.name = 'mouse_gamer';

      const bodyMat = new THREE.MeshStandardMaterial({ color: 0x18181b, roughness: 0.4, metalness: 0.4 });
      const rgbMat = new THREE.MeshStandardMaterial({ color: 0x00ffff, emissive: 0x06b6d4, emissiveIntensity: 0.85 });
      const cordMat = new THREE.MeshStandardMaterial({ color: 0x3f3f46, roughness: 0.8 });

      const body = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.08, 0.26), bodyMat);
      body.castShadow = true;
      group.add(body);

      const wheel = new THREE.Mesh(new THREE.CylinderGeometry(0.022, 0.022, 0.025, 12), rgbMat);
      wheel.rotation.z = Math.PI / 2;
      wheel.position.set(0, 0.045, 0.06);
      group.add(wheel);

      const strip = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.01, 0.08), rgbMat);
      strip.position.set(0, 0.042, -0.05);
      group.add(strip);

      const curve = new THREE.CatmullRomCurve3([
        new THREE.Vector3(0, 0, 0.13),
        new THREE.Vector3(0.02, -0.06, 0.18),
        new THREE.Vector3(-0.03, -0.15, 0.16),
        new THREE.Vector3(0.01, -0.26, 0.12)

      const cableGeom = new THREE.TubeGeometry(curve, 12, 0.008, 6, false);
      const cable = new THREE.Mesh(cableGeom, cordMat);

        rgbMat.color.copy(c);
        rgbMat.emissive.copy(c);

      return group;
    }

    function createGamerKeyboard() {
      const keyboardGroup = new THREE.Group();
      keyboardGroup.name = 'keyboard_gamer';

      // 1. Chassis / Base (Sleek dark gamer body)
      const baseGeom = new THREE.BoxGeometry(0.56, 0.25, 0.04);
      const baseMat = new THREE.MeshStandardMaterial({
        color: 0x18181b,
        roughness: 0.35,
        metalness: 0.7
      });
      const baseMesh = new THREE.Mesh(baseGeom, baseMat);
      baseMesh.castShadow = true;
      baseMesh.receiveShadow = false;
      keyboardGroup.add(baseMesh);

      // 2. Beveled RGB Diffuse Plate
      const plateGeom = new THREE.BoxGeometry(0.53, 0.22, 0.012);
      const plateMat = new THREE.MeshStandardMaterial({
        color: 0x00ffff,
        emissive: 0x00ffff,
        emissiveIntensity: 0.85,
        roughness: 0.2,
        metalness: 0.1
      });
      const plateMesh = new THREE.Mesh(plateGeom, plateMat);
      plateMesh.position.z = 0.022;
      keyboardGroup.add(plateMesh);

      // 3. Keycaps
      const keyMat = new THREE.MeshStandardMaterial({
        color: 0x27272a,
        roughness: 0.5,
        metalness: 0.3
      });
      const wasdMat = new THREE.MeshStandardMaterial({
        color: 0xf43f5e,
        emissive: 0xe11d48,
        emissiveIntensity: 0.75,
        roughness: 0.3,
        metalness: 0.2
      });
      const spaceMat = new THREE.MeshStandardMaterial({
        color: 0x38bdf8,
        emissive: 0x0284c7,
        emissiveIntensity: 0.65,
        roughness: 0.4,
        metalness: 0.2
      });

      const numCols = 12;
      const numRows = 4;
      const keyW = 0.034;
      const keyH = 0.034;
      const keyD = 0.015;
      const gap = 0.007;
      const startX = -((numCols * (keyW + gap)) / 2) + keyW / 2;
      const startY = ((numRows * (keyH + gap)) / 2) - keyH / 2;

      const keyGeom = new THREE.BoxGeometry(keyW, keyH, keyD);

      for (let r = 0; r < numRows; r++) {
        for (let c = 0; c < numCols; c++) {
          if (r === 3 && c >= 4 && c <= 7) continue;

          const isWASD = (r === 1 && c === 2) ||
                         (r === 2 && (c === 1 || c === 2 || c === 3));

          const km = isWASD ? wasdMat : keyMat;
          const kMesh = new THREE.Mesh(keyGeom, km);
          kMesh.position.set(
            startX + c * (keyW + gap),
            startY - r * (keyH + gap),
            0.032
          );
          kMesh.castShadow = true;
          keyboardGroup.add(kMesh);
        }
      }

      // Spacebar
      const spaceGeom = new THREE.BoxGeometry(4 * (keyW + gap) - gap, keyH, keyD);
      const spaceMesh = new THREE.Mesh(spaceGeom, spaceMat);
      spaceMesh.position.set(0, startY - 3 * (keyH + gap), 0.032);
      spaceMesh.castShadow = true;
      keyboardGroup.add(spaceMesh);

      // Micro LED indicators top-right
      const ledMat = new THREE.MeshBasicMaterial({ color: 0x22c55e });
      const ledGeom = new THREE.BoxGeometry(0.012, 0.012, 0.008);
      for (let l = 0; l < 3; l++) {
        const led = new THREE.Mesh(ledGeom, ledMat);
        led.position.set(0.19 + l * 0.022, startY + 0.038, 0.025);
        keyboardGroup.add(led);
      }

      // USB port nub
      const portGeom = new THREE.BoxGeometry(0.05, 0.018, 0.02);
      const portMat = new THREE.MeshStandardMaterial({ color: 0x71717a, metalness: 0.9, roughness: 0.2 });
      const port = new THREE.Mesh(portGeom, portMat);
      port.position.set(0, 0.13, 0);
      keyboardGroup.add(port);

      // RGB live animation callback
      keyboardGroup.userData.updateRGB = (time) => {
        const hue = (time * 0.35) % 1;
        const color = new THREE.Color().setHSL(hue, 1.0, 0.52);
        plateMat.emissive.copy(color);
        plateMat.color.copy(color);
      };

      return keyboardGroup;
    }

    function createFlyingDrone() {
      const group = new THREE.Group();
      group.name = 'pet_drone';

      const bodyMat = new THREE.MeshStandardMaterial({ color: 0x18181b, roughness: 0.3, metalness: 0.8 });
      const whiteMat = new THREE.MeshStandardMaterial({ color: 0xf8fafc, roughness: 0.4 });
      const eyeMat = new THREE.MeshStandardMaterial({ color: 0x06b6d4, emissive: 0x06b6d4, emissiveIntensity: 1.0 });
      const propMat = new THREE.MeshStandardMaterial({ color: 0x38bdf8, roughness: 0.2, transparent: true, opacity: 0.7 });
      const ledG = new THREE.MeshBasicMaterial({ color: 0x22c55e });
      const ledR = new THREE.MeshBasicMaterial({ color: 0xef4444 });

      // Core pod
      const pod = new THREE.Mesh(new THREE.SphereGeometry(0.08, 16, 12), whiteMat);
      pod.scale.set(1.1, 0.7, 1.2);
      group.add(pod);

      // Front camera visor / glowing sensor eye
      const eye = new THREE.Mesh(new THREE.SphereGeometry(0.04, 12, 12), eyeMat);
      eye.position.set(0, 0.01, 0.08);
      group.add(eye);

      // 4 Rotors & spinning props
      const props = [];
      const armOffsets = [
        [-0.12, 0, 0.10],
        [0.12, 0, 0.10],
        [-0.12, 0, -0.10],
        [0.12, 0, -0.10]
      ];

      for (let i = 0; i < armOffsets.length; i++) {
        const [x, y, z] = armOffsets[i];
        // Carbon arm
        const arm = new THREE.Mesh(new THREE.CylinderGeometry(0.012, 0.012, 0.14, 8), bodyMat);
        arm.rotation.z = Math.PI / 2;
        arm.position.set(x * 0.5, y, z * 0.5);
        group.add(arm);

        // Motor housing
        const motor = new THREE.Mesh(new THREE.CylinderGeometry(0.024, 0.024, 0.03, 12), bodyMat);
        motor.position.set(x, y + 0.01, z);
        group.add(motor);

        // Nav LED
        const led = new THREE.Mesh(new THREE.SphereGeometry(0.008, 8, 8), i % 2 === 0 ? ledG : ledR);
        led.position.set(x, y - 0.015, z);
        group.add(led);

        // 2-blade Propeller
        const propBlade = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.004, 0.018), propMat);
        propBlade.position.set(x, y + 0.028, z);
        group.add(propBlade);
        props.push(propBlade);
      }

      group.userData.updateAnim = (time, delta) => {
        for (const p of props) {
          p.rotation.y += delta * 30;
        }
      };

      return group;
    }

    function createFlyingOwl() {
      const group = new THREE.Group();
      group.name = 'pet_owl';

      const bodyMat = new THREE.MeshStandardMaterial({ color: 0x8a5a2b, roughness: 0.85 });
      const darkMat = new THREE.MeshStandardMaterial({ color: 0x451a03, roughness: 0.8 });
      const chestMat = new THREE.MeshStandardMaterial({ color: 0xfef3c7, roughness: 0.9 });
      const featherMat = new THREE.MeshStandardMaterial({ color: 0xd6a35c, roughness: 0.9 });
      const eyeMat = new THREE.MeshStandardMaterial({ color: 0xfbbf24, emissive: 0xd97706, emissiveIntensity: 0.9, roughness: 0.25 });
      const pupilMat = new THREE.MeshBasicMaterial({ color: 0x09090b });
      const beakMat = new THREE.MeshStandardMaterial({ color: 0xf59e0b, roughness: 0.35 });
      const wingMat = new THREE.MeshStandardMaterial({ color: 0x5b2d0e, roughness: 0.75, side: THREE.DoubleSide });
      const wingTipMat = new THREE.MeshStandardMaterial({ color: 0x2f1503, roughness: 0.8, side: THREE.DoubleSide });

      // Compact body + fan tail
      const body = new THREE.Mesh(new THREE.SphereGeometry(0.09, 18, 14), bodyMat);
      body.scale.set(0.92, 1.05, 0.9);
      group.add(body);

      const chest = new THREE.Mesh(new THREE.SphereGeometry(0.07, 14, 12), chestMat);
      chest.position.set(0, -0.02, 0.045);
      chest.scale.set(0.85, 0.95, 0.65);
      group.add(chest);

      // Chest feathers: 3 scallops that break the smooth sphere
      for (let i = 0; i < 3; i++) {
        const scallop = new THREE.Mesh(new THREE.SphereGeometry(0.028 - i * 0.004, 10, 8), i % 2 ? chestMat : featherMat);
        scallop.position.set((i - 1) * 0.032, -0.045 - Math.abs(i - 1) * -0.008, 0.085);
        scallop.scale.set(1, 0.8, 0.5);
        group.add(scallop);
      }

      const tail = new THREE.Mesh(new THREE.ConeGeometry(0.045, 0.09, 8), darkMat);
      tail.position.set(0, -0.09, -0.08);
      tail.rotation.x = -Math.PI * 0.35;
      tail.scale.set(1.4, 1, 0.45);
      group.add(tail);

      // Legs retracted in flight
      for (const side of [-1, 1]) {
        const foot = new THREE.Mesh(new THREE.SphereGeometry(0.016, 8, 6), beakMat);
        foot.position.set(side * 0.035, -0.095, 0.01);
        foot.scale.set(1, 0.6, 1.3);
        group.add(foot);
      }

      // Head: own group for curiosity without moving the body
      const headG = new THREE.Group();
      headG.position.set(0, 0.075, 0.01);
      group.add(headG);

      const head = new THREE.Mesh(new THREE.SphereGeometry(0.062, 16, 12), bodyMat);
      headG.add(head);

      const eyes = [];
      for (const side of [-1, 1]) {
        const disc = new THREE.Mesh(new THREE.CircleGeometry(0.032, 16), chestMat);
        disc.position.set(side * 0.028, 0.008, 0.052);
        headG.add(disc);

        const eye = new THREE.Mesh(new THREE.SphereGeometry(0.022, 12, 10), eyeMat);
        eye.position.set(side * 0.028, 0.008, 0.058);
        headG.add(eye);

        const pupil = new THREE.Mesh(new THREE.SphereGeometry(0.011, 8, 8), pupilMat);
        pupil.position.set(side * 0.028, 0.008, 0.075);
        headG.add(pupil);
        eyes.push({ eye, pupil, side });

        const glint = new THREE.Mesh(new THREE.SphereGeometry(0.004, 6, 6), new THREE.MeshBasicMaterial({ color: 0xffffff }));
        glint.position.set(side * 0.028 - 0.006, 0.015, 0.078);
        headG.add(glint);

        const tuft = new THREE.Mesh(new THREE.ConeGeometry(0.018, 0.055, 6), darkMat);
        tuft.position.set(side * 0.048, 0.062, -0.005);
        tuft.rotation.z = side * -0.35;
        headG.add(tuft);
      }

      const beak = new THREE.Mesh(new THREE.ConeGeometry(0.016, 0.038, 8), beakMat);
      beak.rotation.x = Math.PI / 2 + 0.15;
      beak.position.set(0, -0.012, 0.072);
      headG.add(beak);

      // Feathered wings: scalloped shape instead of a box
      const makeWing = (side) => {
        const pivot = new THREE.Group();
        pivot.position.set(side * 0.075, 0.03, 0);
        const shape = new THREE.Shape();
        shape.moveTo(0, 0.045);
        shape.quadraticCurveTo(side * 0.13, 0.05, side * 0.19, 0.0);
        shape.quadraticCurveTo(side * 0.20, -0.02, side * 0.175, -0.035);
        shape.quadraticCurveTo(side * 0.185, -0.05, side * 0.155, -0.055);
        shape.quadraticCurveTo(side * 0.16, -0.07, side * 0.13, -0.065);
        shape.quadraticCurveTo(side * 0.07, -0.06, 0, -0.045);
        shape.closePath();
        const geo = new THREE.ShapeGeometry(shape, 6);
        const mesh = new THREE.Mesh(geo, wingMat);
        pivot.add(mesh);
        const tipShape = new THREE.Shape();
        tipShape.moveTo(side * 0.13, 0.01);
        tipShape.lineTo(side * 0.19, 0.0);
        tipShape.lineTo(side * 0.16, -0.055);
        tipShape.lineTo(side * 0.11, -0.03);
        tipShape.closePath();
        const tip = new THREE.Mesh(new THREE.ShapeGeometry(tipShape), wingTipMat);
        tip.position.z = 0.001;
        pivot.add(tip);
        group.add(pivot);
        return pivot;
      };

      const wingL = makeWing(-1);
      const wingR = makeWing(1);

      group.userData.updateAnim = (time, delta) => {
        // Flap-glide cycle: sometimes it glides to look natural
        const glide = 0.55 + 0.45 * Math.sin(time * 0.6);
        const amp = 0.18 + 0.5 * Math.max(0, glide);
        const flap = Math.sin(time * 10) * amp + Math.sin(time * 23) * 0.06;
        wingL.rotation.z = 0.12 + flap;
        wingR.rotation.z = -0.12 - flap;
        wingL.rotation.y = Math.sin(time * 10) * 0.08;
        wingR.rotation.y = -Math.sin(time * 10) * 0.08;
        // Breathing + gentle head bobbing
        const breathe = 1 + Math.sin(time * 3.1) * 0.018;
        body.scale.set(0.92, 1.05 * breathe, 0.9);
        group.rotation.x = Math.sin(time * 2.1) * 0.05;
        tail.rotation.x = -Math.PI * 0.35 + Math.sin(time * 10) * 0.08;
        // Curiosity: the head looks to the sides every few seconds
        const ud = group.userData;
        if (ud.nextLook === undefined || time > ud.nextLook) {
          ud.lookTarget = (Math.random() - 0.5) * 0.9;
          ud.nextLook = time + 2.5 + Math.random() * 4;
        }
        headG.rotation.y += ((ud.lookTarget || 0) - headG.rotation.y) * Math.min(1, delta * 4);
        headG.rotation.z = Math.sin(time * 1.7) * 0.05;
        // Blink: squashes the eyes for 0.12s
        if (ud.blinkUntil === undefined) ud.blinkUntil = time + 2 + Math.random() * 3;
        if (time > ud.blinkUntil - 0.12 && time < ud.blinkUntil) {
          for (const e of eyes) { e.eye.scale.y = 0.12; e.pupil.scale.y = 0.12; }
        } else {
          for (const e of eyes) { e.eye.scale.y = 1; e.pupil.scale.y = 1; }
          if (time >= ud.blinkUntil) ud.blinkUntil = time + 2.5 + Math.random() * 3.5;
        }
        // Pupils toward the center (they look at the player when orbiting)
        for (const e of eyes) e.pupil.position.x = e.side * 0.028 - 0.008;
      };

      return group;
    }

    function createFlyingBat() {
      const group = new THREE.Group();
      group.name = 'pet_bat';

      const bodyMat = new THREE.MeshStandardMaterial({ color: 0x1c1917, roughness: 0.6 });

      // Pointed bat ears

        ear.position.set(side * 0.045, 0.10, 0);
        ear.rotation.z = side * -0.25;

        const eye = new THREE.Mesh(new THREE.SphereGeometry(0.016, 8, 8), eyeMat);

      }

      // Snout
      const snout = new THREE.Mesh(new THREE.SphereGeometry(0.024, 8, 8), bodyMat);
      snout.position.set(0, 0.01, 0.075);
      group.add(snout);

      // Wings (scalloped shape)
      const createBatWing = (side) => {
        const wingGroup = new THREE.Group();
        wingGroup.position.set(side * 0.07, 0.02, 0);

        const shape = new THREE.Shape();
        shape.moveTo(0, 0);
        shape.lineTo(side * 0.18, 0.06);
        shape.lineTo(side * 0.24, -0.04);
        shape.lineTo(side * 0.16, -0.10);
        shape.lineTo(side * 0.08, -0.06);
        shape.lineTo(0, -0.08);
        shape.closePath();

        const geom = new THREE.ShapeGeometry(shape);
        const mesh = new THREE.Mesh(geom, wingMat);
        wingGroup.add(mesh);
        return wingGroup;
      };

      const wingL = createBatWing(-1);
      const wingR = createBatWing(1);
      group.add(wingL);
      group.add(wingR);

      group.userData.updateAnim = (time, delta) => {
        const flap = Math.sin(time * 11) * 0.65;
        wingL.rotation.y = flap * 0.5;
        wingL.rotation.z = flap;
        wingR.rotation.y = -flap * 0.5;
        wingR.rotation.z = -flap;
      };

      return group;
    }

    function createFlyingGhost() {
      const group = new THREE.Group();
      group.name = 'pet_ghost';

      const ghostMat = new THREE.MeshStandardMaterial({
        color: 0xeaf6ff,
        emissive: 0x38bdf8,
        emissiveIntensity: 0.45,
        transparent: true,
        opacity: 0.72,
        roughness: 0.15,
        metalness: 0,
        depthWrite: false
      });
      const rimMat = new THREE.MeshBasicMaterial({
        color: 0x7dd3fc, transparent: true, opacity: 0.28,
        side: THREE.BackSide, depthWrite: false
      });
      const faceMat = new THREE.MeshBasicMaterial({ color: 0x0c4a6e });
      const blushMat = new THREE.MeshBasicMaterial({ color: 0xf9a8d4, transparent: true, opacity: 0.55, depthWrite: false });

      // Head + outer halo for a soft glowing edge
      const head = new THREE.Mesh(new THREE.SphereGeometry(0.09, 20, 14, 0, Math.PI * 2, 0, Math.PI * 0.55), ghostMat);
      group.add(head);
      const halo = new THREE.Mesh(new THREE.SphereGeometry(0.098, 18, 12, 0, Math.PI * 2, 0, Math.PI * 0.6), rimMat);
      halo.position.y = 0.002;
      group.add(halo);

      // Skirt with segments to ripple the vertices
      const skirtGeo = new THREE.CylinderGeometry(0.09, 0.075, 0.17, 18, 4, true);
      const skirt = new THREE.Mesh(skirtGeo, ghostMat);
      skirt.position.set(0, -0.085, 0);
      group.add(skirt);
      const skirtBase = skirtGeo.attributes.position.array.slice();

      // Wavy lower edge (ghost peaks)
      const hemGeo = new THREE.TorusGeometry(0.068, 0.012, 8, 18);
      const hem = new THREE.Mesh(hemGeo, ghostMat);
      hem.rotation.x = Math.PI / 2;
      hem.position.y = -0.17;
      group.add(hem);

      // Rippling ribbon tail instead of a rigid cone
      const tailGeo = new THREE.PlaneGeometry(0.07, 0.16, 4, 6);
      const tail = new THREE.Mesh(tailGeo, new THREE.MeshStandardMaterial({
        color: 0xe0f2fe, emissive: 0x38bdf8, emissiveIntensity: 0.4,
        transparent: true, opacity: 0.6, side: THREE.DoubleSide, depthWrite: false, roughness: 0.3
      }));
      tail.position.set(0, -0.16, -0.06);
      tail.rotation.x = 0.5;
      group.add(tail);
      const tailBase = tailGeo.attributes.position.array.slice();

      // Cartoon face: white eyes + pupils that look at the player
      const pupils = [];
      for (const side of [-1, 1]) {
        const white = new THREE.Mesh(new THREE.SphereGeometry(0.024, 12, 10), new THREE.MeshBasicMaterial({ color: 0xffffff }));
        white.position.set(side * 0.034, -0.005, 0.078);
        white.scale.set(1, 1.25, 0.6);
        group.add(white);

        const pupil = new THREE.Mesh(new THREE.SphereGeometry(0.011, 8, 8), faceMat);
        pupil.position.set(side * 0.034, -0.008, 0.09);
        group.add(pupil);
        pupils.push({ pupil, side });

        const blush = new THREE.Mesh(new THREE.CircleGeometry(0.012, 10), blushMat);
        blush.position.set(side * 0.058, -0.035, 0.062);
        blush.rotation.y = side * 0.5;
        group.add(blush);

        // Little floating arms with hands
        const armG = new THREE.Group();
        armG.position.set(side * 0.085, -0.05, 0.01);
        const arm = new THREE.Mesh(new THREE.CapsuleGeometry(0.016, 0.035, 4, 8), ghostMat);
        arm.rotation.z = side * 1.1;
        armG.add(arm);
        const hand = new THREE.Mesh(new THREE.SphereGeometry(0.018, 8, 8), ghostMat);
        hand.position.set(side * 0.035, -0.012, 0);
        armG.add(hand);
        group.add(armG);
        if (!group.userData.arms) group.userData.arms = [];
        group.userData.arms.push({ g: armG, side, phase: side * 1.3 });
      }

      const mouth = new THREE.Mesh(new THREE.SphereGeometry(0.013, 10, 8), faceMat);
      mouth.position.set(0, -0.048, 0.08);
      mouth.scale.set(0.9, 1.2, 0.5);
      group.add(mouth);

      group.userData.updateAnim = (time, delta) => {
        const floatY = Math.sin(time * 2.2) * 0.5 + Math.sin(time * 5.1) * 0.12;
        // Soft pulsing neon glow
        ghostMat.emissiveIntensity = 0.42 + Math.sin(time * 3.2) * 0.14 + Math.sin(time * 7.7) * 0.04;
        rimMat.opacity = 0.22 + Math.sin(time * 3.2) * 0.07;
        // Floating squash & stretch
        group.scale.set(1 - floatY * 0.02, 1 + floatY * 0.035, 1 - floatY * 0.02);
        group.rotation.z = Math.sin(time * 1.8) * 0.06;
        group.rotation.x = Math.sin(time * 2.6) * 0.04;
        // Rippling skirt: moves the lower ring with a sine by angle
        const pos = skirtGeo.attributes.position;
        for (let i = 0; i < pos.count; i++) {
          const bx = skirtBase[i * 3], by = skirtBase[i * 3 + 1], bz = skirtBase[i * 3 + 2];
          const lower = THREE.MathUtils.clamp((-by) / 0.17, 0, 1);
          const ang = Math.atan2(bz, bx);
          const w = Math.sin(ang * 3 + time * 5) * 0.012 * lower + Math.cos(ang * 2 - time * 4) * 0.008 * lower;
          pos.setXYZ(i, bx + Math.cos(ang) * w, by, bz + Math.sin(ang) * w);
        }
        pos.needsUpdate = true;
        skirtGeo.computeVertexNormals();
        hem.position.y = -0.17 + Math.sin(time * 5) * 0.006;
        hem.scale.set(1 + Math.sin(time * 5) * 0.03, 1 + Math.cos(time * 5) * 0.03, 1);
        // Winding tail
        const tp = tailGeo.attributes.position;
        for (let i = 0; i < tp.count; i++) {
          const bx = tailBase[i * 3], by = tailBase[i * 3 + 1];
          const k = (0.08 - by) / 0.16;
          tp.setX(i, bx + Math.sin(time * 6 + k * 4) * 0.02 * k);
        }
        tp.needsUpdate = true;
        // Mouth that opens on the way up and arms swimming
        mouth.scale.y = 1.1 + Math.max(0, Math.sin(time * 2.2)) * 0.7;
        for (const a of group.userData.arms) {
          a.g.position.y = -0.05 + Math.sin(time * 3 + a.phase) * 0.015;
          a.g.rotation.z = a.side * (0.25 + Math.sin(time * 3 + a.phase) * 0.25);
        }
        // Pupils look at the center (at the player)
        for (const p of pupils) p.pupil.position.x = p.side * 0.034 - 0.007;
      };

      return group;
    }

    let activePetObject = null;

    function applyPet(parentGroup, config) {
      if (activePetObject && activePetObject.parent) {
        activePetObject.parent.remove(activePetObject);
        activePetObject = null;
      }
      const petType = config.pet || 'none';
      if (petType === 'none') return;

      if (petType === 'drone') activePetObject = createFlyingDrone();
      else if (petType === 'owl') activePetObject = createFlyingOwl();
      else if (petType === 'bat') activePetObject = createFlyingBat();
      else if (petType === 'ghost') activePetObject = createFlyingGhost();
      else if (petType === 'chicken') {
        activePetObject = createGroundChicken(playerGroup, config.chickenVariant || 'A');
        scene.add(activePetObject);
      }

      if (activePetObject && parentGroup && !activePetObject.userData.isGroundPet) {
        parentGroup.add(activePetObject);
      }
    }

    // Ground pet in WORLD SPACE: strolls on a disc around the player and
    // only follows them (hopping) if they get farther than the leash. It starts walking
    // 2s after the player starts moving. It slows down on arrival, avoids walls
    // (uses the sector with the most space) and pecks when standing still.
    function updateGroundPet(obj, time, delta) {
      const ud = obj.userData;
      const pr = ud.playerRef;
      const dt = Math.min(delta, 0.1);
      const ppx = pr ? pr.position.x : 0;
      const ppz = pr ? pr.position.z : 0;
      const yaw = pr ? pr.rotation.y : 0;
      // Behind the player depending on where they face.
      const anx = ppx - Math.sin(yaw) * 0.85;
      const anz = ppz - Math.cos(yaw) * 0.85;
      // Walls only where there is a collision system (world, not preview).
      const blocked = (x, z) =>
        typeof checkBuildingCollision === 'function' && checkBuildingCollision(x, z, 0.15);
      // Validated anchor: if it falls inside a building, the free point closest to the player.
      let vax = anx;
      let vaz = anz;
      if (blocked(anx, anz)) {
        let bestD = 1e9;
        for (let k = 0; k < 12; k++) {
          const a = (k / 12) * Math.PI * 2;
          for (const r of [0.4, 0.8, 1.2]) {
            const cx = ppx + Math.cos(a) * r;
            const cz = ppz + Math.sin(a) * r;
            if (!blocked(cx, cz)) {
              const d = Math.hypot(cx - ppx, cz - ppz);
              if (d < bestD) {
                bestD = d;
                vax = cx;
                vaz = cz;
              }
            }
          }
        }
      }
      if (ud.groundYaw === undefined) {
        ud.groundYaw = Math.PI;
        obj.rotation.y = Math.PI;
        obj.position.set(vax + 0.3, 0, vaz + 0.15);
        ud.groundHop = 0;
        ud.thinkAt = 0;
        ud.peckAt = time + 3 + Math.random() * 3;
        ud.peckUntil = 0;
      }

      // Anti-teleport: if it ended up more than 8 away, it appears next to the player.
      if (Math.hypot(obj.position.x - ppx, obj.position.z - ppz) > 8) {
        obj.position.set(vax, 0, vaz);
        ud.tx = undefined;
      }

      const LEASH = 1.6;
      const WANDER_R = 0.9;
      const PERSONAL = 0.35;
      const distP = Math.hypot(obj.position.x - ppx, obj.position.z - ppz);

      // Start lock: the chicken starts walking 2s after the
      // player starts moving, even if they keep moving.
      if (ud.lastPpx === undefined) {
        ud.lastPpx = ppx;
        ud.lastPpz = ppz;
        ud.lastMoveAt = -10;
        ud.lockStart = undefined;
      }
      const playerMoved = Math.hypot(ppx - ud.lastPpx, ppz - ud.lastPpz) > 0.005;
      ud.lastPpx = ppx;
      ud.lastPpz = ppz;
      if (playerMoved) {
        if (ud.lockStart === undefined) ud.lockStart = time;
        ud.lastMoveAt = time;
      } else if (time - ud.lastMoveAt > 1.0) {
        ud.lockStart = undefined;
      }
      const mayWalk = ud.lockStart !== undefined && time - ud.lockStart >= 2;
      const fresh = ud.lockStart === undefined && ud.lastMoveAt === -10;

      // Think: sample stroll points and keep the first free one.
      const hasTarget = ud.tx !== undefined;
      const arrived = hasTarget && Math.hypot(ud.tx - obj.position.x, ud.tz - obj.position.z) < 0.08;
      if ((!hasTarget || arrived) && time >= ud.thinkAt) {
        ud.tx = undefined;
        for (let k = 0; k < 6; k++) {
          const a = Math.random() * Math.PI * 2;
          const r = PERSONAL + Math.random() * (WANDER_R - PERSONAL);
          const cx = ppx + Math.cos(a) * r;
          const cz = ppz + Math.sin(a) * r;
          if (!blocked(cx, cz)) {
            ud.tx = cx;
            ud.tz = cz;
            break;
          }
        }
        ud.thinkAt = time + 2 + Math.random() * 2;
      }

      // Destination: the stroll point, or the validated anchor if it went past the leash.
      let gx = ud.tx ?? vax;
      let gz = ud.tz ?? vaz;
      let maxSpeed = 0.5;
      if (distP > LEASH) {
        gx = vax;
        gz = vaz;
        maxSpeed = 4.5;
      }

      const dx = gx - obj.position.x;
      const dz = gz - obj.position.z;
      const dist = Math.hypot(dx, dz);
      const wantWalk = dist > 0.08;
      const hopping =
        wantWalk && (fresh || mayWalk || (ud.wasHopping && ud.lockStart === undefined));
      ud.wasHopping = hopping;
      // Speed proportional to distance: it slows down on arrival.
      const speed = Math.min(maxSpeed, 0.15 + dist * (maxSpeed > 1 ? 2.5 : 1.5));
      const hopAmp = 0.02 + 0.04 * Math.min(1, speed / 1.5);
      let advanced = false;
      if (hopping) {
        const step = Math.min(dist, speed * dt);
        const nx = dx / (dist || 1);
        const nz = dz / (dist || 1);
        const sx = obj.position.x + nx * step;
        const sz = obj.position.z + nz * step;
        // It only brakes on ENTERING a wall: if it is already inside, it lets it out.
        if (!blocked(obj.position.x, obj.position.z) && blocked(sx, sz)) {
          // Wall in the way: it stops and rethinks.
          ud.tx = undefined;
          ud.thinkAt = time + 0.5;
        } else {
          obj.position.x = sx;
          obj.position.z = sz;
          advanced = true;
          const targetYaw = Math.atan2(nx, nz);
          let cur = ud.groundYaw;
          let d = targetYaw - cur;
          while (d > Math.PI) d -= Math.PI * 2;
          while (d < -Math.PI) d += Math.PI * 2;
          cur += d * (1 - Math.exp(-6 * dt));
          ud.groundYaw = cur;
          obj.rotation.y = cur;
          ud.groundHop += step * 22;
        }
      }
      obj.position.y = advanced ? Math.abs(Math.sin(ud.groundHop)) * hopAmp : Math.sin(time * 2) * 0.008;
      obj.rotation.z = 0;

      // Occasional pecking when standing still.
      if (!advanced && time >= ud.peckAt) {
        ud.peckUntil = time + 0.6;
        ud.peckAt = time + 4 + Math.random() * 3;
      }
      const pecking = !advanced && time < ud.peckUntil;
      obj.rotation.x = pecking ? Math.sin(((time - (ud.peckUntil - 0.6)) / 0.6) * Math.PI) * 0.35 : 0;
    }

    const FLY_PROFILES = {
      owl: { speed: 1.05, radius: 0.68, height: 0.98, bob: 0.07, bobFreq: 2.4, wobble: 0.14, bank: 0.45 },
      ghost: { speed: 0.8, radius: 0.52, height: 0.78, bob: 0.09, bobFreq: 2.2, wobble: 0.18, bank: 0.3, erratic: true },
      bat: { speed: 1.5, radius: 0.6, height: 0.9, bob: 0.08, bobFreq: 3.4, wobble: 0.16, bank: 0.55 },
      drone: { speed: 1.35, radius: 0.58, height: 0.86, bob: 0.035, bobFreq: 4.2, wobble: 0.05, bank: 0.35 },
    };

    function updateFlyingPet(time, delta) {
      if (!activePetObject || !activePetObject.parent) return;
      if (activePetObject.userData.isGroundPet) {
        updateGroundPet(activePetObject, time, delta);
        return;
      }
      const dt = Math.min(Math.max(delta || 0.016, 0.001), 0.05);
      const kind = (activePetObject.name || '').replace('pet_', '') || 'drone';
      const p = FLY_PROFILES[kind] || FLY_PROFILES.drone;
      const ud = activePetObject.userData;
      let slow = 1;
      try {
        if (typeof window !== 'undefined' && window.matchMedia &&
          window.matchMedia('(prefers-reduced-motion: reduce)').matches) slow = 0.4;
      } catch (e) { /* noop */ }
      if (ud.orbitAngle === undefined) {
        ud.orbitAngle = Math.atan2(activePetObject.position.z || 0.1, activePetObject.position.x || 0.5);
        ud.prevX = activePetObject.position.x;
        ud.prevZ = activePetObject.position.z;
        ud.prevY = activePetObject.position.y;
        ud.smoothYaw = 0;
        ud.smoothRoll = 0;
        ud.smoothPitch = 0;
      }
      // Speed with organic drift (not a perfect rocker)
      const drift = 1 + Math.sin(time * 0.5) * 0.18 + Math.sin(time * 0.23 + 1.7) * 0.12;
      ud.orbitAngle += dt * p.speed * drift * slow;
      const angle = ud.orbitAngle;
      // Living radius: Lissajous + extra erratic movement for the ghost
      let r = p.radius + Math.sin(time * 0.7) * p.wobble * 0.5 + Math.sin(time * 1.3 + 0.8) * p.wobble * 0.3;
      if (p.erratic) r += Math.sin(time * 2.1) * 0.05 + Math.sin(time * 3.7 + 2) * 0.03;
      r = Math.max(0.45, r);
      const x = Math.cos(angle) * r;
      const z = Math.sin(angle) * r * 0.92;
      const y = p.height + Math.sin(time * p.bobFreq) * p.bob + Math.sin(time * (p.bobFreq * 2.3) + 1) * p.bob * 0.25;
      activePetObject.position.set(x, y, z);
      // Real velocity to orient + bank (natural pitch/roll)
      const vx = (x - (ud.prevX ?? x)) / dt;
      const vz = (z - (ud.prevZ ?? z)) / dt;
      const vy = (y - (ud.prevY ?? y)) / dt;
      ud.prevX = x; ud.prevZ = z; ud.prevY = y;
      const targetYaw = Math.atan2(vx, vz);
      let dy = targetYaw - (ud.smoothYaw || targetYaw);
      while (dy > Math.PI) dy -= Math.PI * 2;
      while (dy < -Math.PI) dy += Math.PI * 2;
      const k = 1 - Math.exp(-6 * dt);
      ud.smoothYaw = (ud.smoothYaw ?? targetYaw) + dy * k;
      // Bank by turn + pitch by climb/descent, smoothed
      const turnRate = THREE.MathUtils.clamp(dy / Math.max(dt, 0.001), -4, 4);
      const targetRoll = THREE.MathUtils.clamp(-turnRate * 0.18 * p.bank * 2.2, -0.5, 0.5) - 0.08;
      const targetPitch = THREE.MathUtils.clamp(-vy * 0.35, -0.3, 0.3);
      ud.smoothRoll += (targetRoll - (ud.smoothRoll || 0)) * k;
      ud.smoothPitch += (targetPitch - (ud.smoothPitch || 0)) * k;
      activePetObject.rotation.set(ud.smoothPitch, ud.smoothYaw, ud.smoothRoll, 'YXZ');
      if (ud.updateAnim) ud.updateAnim(time, dt);
    }

    function loadWeapon(fileName) {
      if (!fileName || fileName === 'none') return Promise.resolve(null);
      if (fileName === 'keyboard_gamer' || fileName.includes('spellbook')) {
        const kb = createGamerKeyboard();
        kb.position.set(0, 0.06, -0.10);
        kb.scale.set(1.15, 1.15, 1.15);
        activeRGBObjects.add(kb);
        return Promise.resolve(kb);
      }
      if (fileName === 'mouse_gamer') {
        const mouse = createGamingMouse();
        mouse.position.set(0, 0.08, -0.12);
        mouse.scale.set(1.25, 1.25, 1.25);
        activeRGBObjects.add(mouse);
        return Promise.resolve(mouse);
      }
      if (fileName === 'rubber_duck') {
        const duck = createRubberDuck();
        duck.position.set(0, 0.10, -0.12);
        duck.scale.set(1.25, 1.25, 1.25);
        return Promise.resolve(duck);
      }
      if (fileName === 'mate_argentino') {
        const mate = createMate();
        mate.position.set(0, 0.10, -0.12);
        mate.scale.set(1.25, 1.25, 1.25);
        return Promise.resolve(mate);
      }
      if (fileName === 'energy_can') {
        const can = createRedBullCan();
        can.position.set(0, 0.08, -0.12);
        can.scale.set(1.25, 1.25, 1.25);
        return Promise.resolve(can);
      }
      if (fileName === 'pokeball') {
        const poke = createPokeball();
        poke.position.set(0, 0.10, -0.12);
        poke.scale.set(1.25, 1.25, 1.25);
        return Promise.resolve(poke);
      }
      if (fileName === 'puzzlecube_complete.gltf') {
        return loadMixedGltf(fileName).then((scene) => {
          if (!scene) return null;
          const r = scene.clone(true);
          r.scale.setScalar(0.6);
          r.position.set(0, 0.08, -0.05);
          return r;
        });
      }
      return new Promise((resolve) => {
        loader.load(
          'Assets/CharacterV2/Assets/gltf/' + fileName,
          (gltf) => {
            const obj = gltf.scene;
            resolve(obj);
          },
          undefined,
          () => resolve(null)
        );
      });
    }

    function findHandSlot(model, side) {
      if (!model) return null;
      const candidates = side === 'r'
        ? ['handslotr', 'handslot.r', 'handslot_r', 'handr', 'hand.r']
        : ['handslotl', 'handslot.l', 'handslot_l', 'handl', 'hand.l'];

      for (const name of candidates) {
        const obj = model.getObjectByName(name);
        if (obj) return obj;
      }
      let found = null;
      model.traverse((node) => {
        if (!found && node.name) {
          const n = node.name.toLowerCase();
          if (n.includes('handslot') && (n.includes(side) || n.endsWith(side))) {
            found = node;
          }
        }
      });
      return found;
    }

    async function attachItems(model, config) {
      const rHand = findHandSlot(model, 'r');
      const lHand = findHandSlot(model, 'l');

      if (rHand && config.rightHandItem && config.rightHandItem !== 'none') {
        const item = await loadWeapon(config.rightHandItem);
        if (item) {
          while (rHand.children.length > 0) rHand.remove(rHand.children[0]);
          rHand.add(item);
        }
      }
      if (lHand && config.leftHandItem && config.leftHandItem !== 'none') {
        const item = await loadWeapon(config.leftHandItem);
        if (item) {
          while (lHand.children.length > 0) lHand.remove(lHand.children[0]);
          lHand.add(item);
        }
      }
    }

    const topClass = config.topStyle || config.characterClass || 'Knight';
    const charUrl = `Assets/CharacterV2/Characters/gltf/${topClass}.glb`;

    loader.load(
      charUrl,
      async (gltf) => {
        const model = gltf.scene;
        model.scale.set(0.32, 0.32, 0.32);
        await applyModularParts(model, config);
        applyCosmetics(model, config);
        await attachItems(model, config);
        playerGroup.add(model);
        applyPet(playerGroup, config);

        loader.load(
          'Assets/CharacterV2/Animations/gltf/Rig_Medium/Rig_Medium_General.glb',
          (animGltf) => {
            if (animGltf.animations && animGltf.animations.length) {
              mixer = new THREE.AnimationMixer(model);
              const idle = animGltf.animations.find((a) => a.name === 'Idle_A') ?? animGltf.animations[0];
              mixer.clipAction(idle).play();
            }
          },
          undefined,
          (err) => console.warn('Could not load avatar animations:', err)
        );
      },
      undefined,
      (err) => console.error('Could not load the avatar:', err)
    );

    function animar() {
      requestAnimationFrame(animar);
      const delta = clock.getDelta();
      controls.update();
      if (mixer) mixer.update(delta);
      updateFlyingPet(performance.now() * 0.001, delta);

      if (activeRGBObjects.size > 0) {
        const timeSec = performance.now() * 0.001;
        activeRGBObjects.forEach((kb) => {
          if (kb.parent) {
            if (kb.userData && kb.userData.updateRGB) {
              kb.userData.updateRGB(timeSec);
            }
          } else {
            activeRGBObjects.delete(kb);
          }
        });
      }

      renderer.render(scene, camera);
    }
    animar();
  </script>
</body>
</html>
