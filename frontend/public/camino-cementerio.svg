<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 768" width="1024" height="768">
  <desc>Camino de tierra pixelado e imperfecto para fondo de cementerio isométrico</desc>
  <defs>
    <!-- Definimos colores de la paleta nocturna para el efecto granulado -->
    <style>
      .ground-base { fill: #2c3a5e; } /* Color base del suelo oscuro */
      .dirt-dark { fill: #5d4037; }  /* Color oscuro del camino */
      .dirt-light { fill: #795548; } /* Color claro del camino */
    </style>
  </defs>
  
  <!-- Estructura del camino de tierra (bloques base y efecto granulado) -->
  <g id="path-2-graveyard">
    <!-- Bloques Base (Rectangulares) -->
    <rect x="230" y="520" width="80" height="30" class="dirt-dark" />
    <rect x="310" y="490" width="80" height="30" class="dirt-dark" />
    <rect x="390" y="460" width="80" height="30" class="dirt-dark" />
    <rect x="470" y="430" width="80" height="30" class="dirt-dark" />
    <rect x="550" y="400" width="80" height="30" class="dirt-dark" />
    <rect x="630" y="370" width="80" height="30" class="dirt-dark" />
    <rect x="710" y="340" width="80" height="30" class="dirt-dark" />
    
    <!-- Bloques de Cima (Color claro para profundidad) -->
    <rect x="230" y="490" width="80" height="30" class="dirt-light" />
    <rect x="310" y="460" width="80" height="30" class="dirt-light" />
    <rect x="390" y="430" width="80" height="30" class="dirt-light" />
    <rect x="470" y="400" width="80" height="30" class="dirt-light" />
    <rect x="550" y="370" width="80" height="30" class="dirt-light" />
    <rect x="630" y="340" width="80" height="30" class="dirt-light" />
    <rect x="710" y="310" width="80" height="30" class="dirt-light" />
    
    <!-- Efecto Granulado/Desvanecimiento (Píxeles dispersos) -->
    <rect x="228" y="492" width="2" height="2" class="ground-base" /> <!-- Píxel de suelo -->
    <rect x="230" y="488" width="2" height="2" class="dirt-light" /> <!-- Píxel de tierra -->
    <rect x="468" y="402" width="2" height="2" class="ground-base" />
    <rect x="470" y="398" width="2" height="2" class="dirt-light" />
    <rect x="708" y="312" width="2" height="2" class="ground-base" />
    <rect x="710" y="308" width="2" height="2" class="dirt-light" />
    <rect x="788" y="312" width="2" height="2" class="ground-base" />
    <rect x="790" y="308" width="2" height="2" class="dirt-light" />
    <!-- ... añadir más píxeles aquí ... -->
  </g>
</svg>
