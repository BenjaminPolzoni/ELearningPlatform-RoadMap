<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Avatar Preview</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #161328;
      overflow: hidden;
    }
    canvas {
      display: block;
    }
    #avatar-status {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      color: #cbd5e1;
      font: 600 12px/1.5 system-ui, sans-serif;
      text-align: center;
    }
    #avatar-status[hidden] { display: none; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="avatar-status" role="status" aria-live="polite">Cargando avatar 3D…</div>
  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import {
      APPROVED_AVATAR_URL,
      createModularAvatar,
      isGLBBuffer,
      normalizeAvatarConfig
    } from './avatar-glb.js';

    // Mismo esquema que city_generator.html (localStorage 'modular_character_config'):
    // { gender, hairStyle, topStyle, bottomStyle, shoeStyle, colores y slots modulares }.
    // Comparten origen (localhost), así que leemos lo que el alumno ya haya elegido
    // en "Personalizar Personaje"; si todavía no eligió nada, usamos un default.
    const DEFAULT_CONFIG = normalizeAvatarConfig();

    function leerConfig() {
      try {
        const saved = localStorage.getItem('modular_character_config');
        if (saved) return normalizeAvatarConfig(JSON.parse(saved));
      } catch (e) {
        console.warn('No se pudo leer modular_character_config:', e);
      }
      return DEFAULT_CONFIG;
    }

    // No usamos canvas transparente: `backdrop-blur` en la tarjeta del login (Chromium)
    // fuerza una capa opaca detrás de un WebGL con alpha, y siempre termina en blanco.
    // En su lugar pintamos el fondo del mismo violeta oscuro que la tarjeta
    // (--color-base-200 del tema "arcade-dark" en styles.css) para que se vea igual.
    const FONDO_TARJETA = 0x161328;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(FONDO_TARJETA);
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 20);
    camera.position.set(0, 0.72, 2.25);
    camera.lookAt(0, 0.68, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);

    scene.add(new THREE.AmbientLight(0xffffff, 0.85));
    const key = new THREE.DirectionalLight(0xfff2e0, 1.1);
    key.position.set(1.5, 3, 2);
    scene.add(key);
    const rim = new THREE.DirectionalLight(0x8b3df5, 0.6);
    rim.position.set(-2, 1.5, -1.5);
    scene.add(rim);

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    const config = leerConfig();
    const playerGroup = new THREE.Group();
    scene.add(playerGroup);

    const status = document.getElementById('avatar-status');
    const loader = new GLTFLoader();
    let avatarController = null;

    async function cargarAvatar() {
      try {
        const response = await fetch(APPROVED_AVATAR_URL);
        if (!response.ok) throw new Error('Falta el archivo avatar-low-poly-approved.glb');
        const buffer = await response.arrayBuffer();
        if (!isGLBBuffer(buffer)) throw new Error('El recurso recibido no es un GLB válido');
        avatarController = await createModularAvatar(loader, buffer, config);
        avatarController.model.scale.setScalar(0.74);
        playerGroup.add(avatarController.model);
        status.hidden = true;
      } catch (error) {
        status.textContent = 'Avatar 3D pendiente: incorporá el GLB aprobado para habilitar esta vista.';
        console.warn('[Avatar GLB]', error);
      }
    }

    cargarAvatar();

    const clock = new THREE.Clock();

    function animar() {
      requestAnimationFrame(animar);
      const delta = clock.getDelta();
      avatarController?.update(delta);
      renderer.render(scene, camera);
    }
    animar();
  </script>
</body>
</html>
