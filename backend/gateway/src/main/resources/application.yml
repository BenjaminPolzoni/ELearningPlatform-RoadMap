# Stand-in local de Gateway — ver GatewayApplication.java y GatewayRouteConfig.java

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      # Ruteo estático en GatewayRouteConfig — el discovery locator dinámico queda
      # para cuando el equipo real de infraestructura (Tema 01) lo integre.
      discovery:
        locator:
          enabled: false

server:
  port: ${SERVER_PORT:8080}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    # No necesitamos que otros nos descubran a nosotros — somos el punto de entrada fijo.
    register-with-eureka: false
    # Sí necesitamos resolver instancias vivas de roadmap-service (lb://).
    fetch-registry: true

management:
  endpoints:
    web:
      exposure:
        include: health, info

logging:
  level:
    org.springframework.cloud.gateway: INFO
