openapi: 3.0.3
info:
  title: roadmap-service — Tema 10 · Grupo 10
  description: >
    Contrato de "Roadmap y Progreso". Fuente de verdad del front (ver
    path/01-arquitectura-y-stack.md §4 — contract-first). Cada path indica su estado:
    `[IMPLEMENTADO]` ya existe en el código, `[PLANEADO]` es el contrato objetivo de
    fases futuras — el front puede mockear contra él desde ya.

    Regla transversal (Camino 6, RF-CUR-09): si el curso está ARCHIVADO
    (`CursoArchivadoEvent` ya consumido), toda escritura del grafo y `cierre/confirmar`
    responden **409**; las lecturas y el ranking siguen respondiendo normal.
  version: "0.2.0"
servers:
  - url: /api/roadmap
    description: >
      Prefijo externo servido por el Gateway (deck Tema 01). El Gateway reenvía el path
      completo sin reescribir — este servidor es también el base path del controller.

tags:
  - name: grafo
    description: Editor y navegación del roadmap (RF-CUR)
  - name: progreso
    description: Estado de cada nodo por alumno
  - name: xp
    description: Historial de movimientos de XP (RF-CFG-06)
  - name: vidas
    description: ⚠️ Alcance a confirmar — ver path/README.md §1.2
  - name: niveles
    description: Curva de niveles (RF-NIV)
  - name: insignias
    description: Logros ganados (RF-RNK-11)
  - name: ranking
    description: Comparativas de cohorte (RF-RNK)
  - name: cierre
    description: ⚠️ Alcance a confirmar — cierre académico del curso

paths:
  # ── Grafo del roadmap ──────────────────────────────────────────────
  /roadmaps:
    post:
      summary: "[IMPLEMENTADO] Crear el roadmap de un curso"
      tags: [grafo]
      security: [{ bearerAuth: [PROFESOR] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cursoCohorteId]
              properties:
                cursoCohorteId: { type: string, format: uuid }
      responses:
        "201":
          description: Roadmap creado en estado BORRADOR
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Roadmap" }
        "409":
          description: Ya existe un roadmap activo para ese curso
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetail" }

  /roadmaps/{cc}:
    parameters:
      - $ref: "#/components/parameters/cursoCohorteId"
    get:
      summary: >
        [IMPLEMENTADO] Grafo completo del editor: metadata del roadmap + secciones
        ordenadas con sus nodos + conexiones. La vista de ALUMNO filtrada por progreso
        todavía no está (ver deuda-tecnica/tarea-deuda-06-contrato-api.md).
      tags: [grafo]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GrafoRoadmap" }
        "404":
          description: No existe roadmap para ese curso
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetail" }
    put:
      summary: "[IMPLEMENTADO] Cambiar estado del roadmap (borrador ↔ publicado)"
      tags: [grafo]
      security: [{ bearerAuth: [PROFESOR] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [estado]
              properties:
                estado: { type: string, enum: [BORRADOR, PUBLICADO] }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Roadmap" }
        "404":
          description: No existe roadmap para ese curso
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetail" }

  /roadmaps/{cc}/secciones:
    parameters:
      - $ref: "#/components/parameters/cursoCohorteId"
    post:
      summary: "[IMPLEMENTADO] Crear unidad con su umbral_xp_desbloqueo"
      tags: [grafo]
      security: [{ bearerAuth: [PROFESOR] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NuevaSeccion" }
      responses:
        "201":
          description: Creada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Seccion" }
        "404":
          description: No existe roadmap para ese curso
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetail" }

  /roadmaps/{cc}/secciones/{id}:
    parameters:
      - $ref: "#/components/parameters/cursoCohorteId"
      - $ref: "#/components/parameters/id"
    put:
      summary: "[IMPLEMENTADO] Editar nombre, umbral u orden (reemplazo completo)"
      tags: [grafo]
      security: [{ bearerAuth: [PROFESOR] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NuevaSeccion" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Seccion" }
        "404":
          description: No existe el roadmap, o la sección no es de este roadmap
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetail" }
    delete:
      summary: >
        [IMPLEMENTADO] Baja lógica de la unidad. En cascada da de baja también sus
        nodos activos y toda conexión que los toque (RF-NFR-01).
      tags: [grafo]
      security: [{ bearerAuth: [PROFESOR] }]
      responses:
        "204": { description: Sin contenido }
        "404":
          description: No existe el roadmap, o la sección no es de este roadmap
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetail" }

  /roadmaps/{cc}/nodos:
    parameters:
      - $ref: "#/components/parameters/cursoCohorteId"
    post:
      summary: "[IMPLEMENTADO] Crear actividad — vincula desafio_id, es_obligatorio, reintentos_permitidos"
      tags: [grafo]
      security: [{ bearerAuth: [PROFESOR] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NuevoNodo" }
      responses:
        "201":
          description: Creado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Nodo" }
        "400":
          description: "Atributos incoherentes (ej. HITO con desafioId)"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetail" }
        "404":
          description: No existe el roadmap, o la sección no es de este roadmap
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetail" }

  /roadmaps/{cc}/nodos/{id}:
    parameters:
      - $ref: "#/components/parameters/cursoCohorteId"
      - $ref: "#/components/parameters/id"
    put:
      summary: >
        [IMPLEMENTADO] Editar atributos del nodo (reemplazo completo). Permite mover la
        actividad a otra sección del mismo roadmap vía seccionId.
      tags: [grafo]
      security: [{ bearerAuth: [PROFESOR] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NuevoNodo" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Nodo" }
        "400":
          description: "Atributos incoherentes (ej. HITO con desafioId)"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetail" }
        "404":
          description: No existe el roadmap, o el nodo/sección no son de este roadmap
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetail" }
    delete:
      summary: "[IMPLEMENTADO] Baja lógica del nodo y de las conexiones que lo tocan"
      tags: [grafo]
      security: [{ bearerAuth: [PROFESOR] }]
      responses:
        "204": { description: Sin contenido }
        "404":
          description: No existe el roadmap, o el nodo no es de este roadmap
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetail" }

  /roadmaps/{cc}/conexiones:
    parameters:
      - $ref: "#/components/parameters/cursoCohorteId"
    post:
      summary: >
        [IMPLEMENTADO] Conectar dos nodos (prerequisito). El grafo de prerequisitos se
        mantiene como DAG: se rechaza el auto-lazo y cualquier arista que cerraría un
        ciclo (400), y el duplicado (409).
      tags: [grafo]
      security: [{ bearerAuth: [PROFESOR] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NuevaConexion" }
      responses:
        "201":
          description: Creada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Conexion" }
        "400":
          description: "Auto-lazo, nodo de otro roadmap, o la arista cerraría un ciclo"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetail" }
        "404":
          description: No existe roadmap para ese curso
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetail" }
        "409":
          description: Ya existe una conexión activa con ese origen y destino
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetail" }

  /roadmaps/{cc}/conexiones/{id}:
    parameters:
      - $ref: "#/components/parameters/cursoCohorteId"
      - $ref: "#/components/parameters/id"
    delete:
      summary: "[IMPLEMENTADO] Quitar el prerequisito (baja lógica)"
      tags: [grafo]
      security: [{ bearerAuth: [PROFESOR] }]
      responses:
        "204": { description: Sin contenido }
        "404":
          description: No existe el roadmap, o la conexión no es de este roadmap
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetail" }

  # ── Progreso ───────────────────────────────────────────────────────
  /alumnos/{aid}/progreso:
    parameters:
      - $ref: "#/components/parameters/alumnoId"
      - $ref: "#/components/parameters/cursoCohorteIdQuery"
    get:
      summary: "[PLANEADO] Estado de cada nodo para ese alumno"
      tags: [progreso]
      security: [{ bearerAuth: [ALUMNO, PROFESOR] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ProgresoNodo" }

  # ── XP ─────────────────────────────────────────────────────────────
  /alumnos/{aid}/xp:
    parameters:
      - $ref: "#/components/parameters/alumnoId"
      - $ref: "#/components/parameters/cursoCohorteIdQuery"
    get:
      summary: "[PLANEADO] Historial de movimientos + total"
      tags: [xp]
      security: [{ bearerAuth: [ALUMNO, PROFESOR] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/XpResumen" }

  /alumnos/{aid}/xp/ajustes:
    parameters:
      - $ref: "#/components/parameters/alumnoId"
    post:
      summary: "[PLANEADO] Corrección manual excepcional — queda auditada"
      tags: [xp]
      security: [{ bearerAuth: [ADMIN] }]
      responses: { "201": { description: Movimiento registrado } }

  # ── Vidas ⚠️ alcance a confirmar ──────────────────────────────────
  /alumnos/{aid}/vidas:
    parameters:
      - $ref: "#/components/parameters/alumnoId"
      - $ref: "#/components/parameters/cursoCohorteIdQuery"
    get:
      summary: "[PLANEADO] ⚠️ Vidas vigentes + histórico de pérdidas"
      tags: [vidas]
      security: [{ bearerAuth: [ALUMNO, PROFESOR] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VidasEstado" }

  /alumnos/{aid}/vidas/recuperacion:
    parameters:
      - $ref: "#/components/parameters/alumnoId"
      - $ref: "#/components/parameters/cursoCohorteIdQuery"
    post:
      summary: "[IMPLEMENTADO] Iniciar el desafío de recuperación (RF-REC-04)"
      tags: [vidas]
      security: [{ bearerAuth: [ALUMNO] }]
      responses:
        "200":
          description: Desafío de recuperación asignado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecuperacionAsignada" }
        "409":
          description: >
            El alumno todavía tiene vidas (RecuperacionNoCorrespondeException) o el pool
            del curso está vacío (PoolRecuperacionVacioException)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetail" }

  /alumnos/{aid}/vidas/compra:
    parameters:
      - $ref: "#/components/parameters/alumnoId"
    post:
      summary: "[PLANEADO] ⚠️ Registrar MovimientoVida tipo comprada (lo confirma Banco vía Gateway)"
      tags: [vidas]
      security: [{ bearerAuth: [] }]
      responses: { "201": { description: Movimiento registrado } }

  # ── Niveles ────────────────────────────────────────────────────────
  /roadmaps/{cc}/niveles:
    parameters:
      - $ref: "#/components/parameters/cursoCohorteId"
    get:
      summary: >
        [IMPLEMENTADO] Curva de niveles vigente del curso. Si el profesor no definió una
        curva custom devuelve la por defecto del sistema (PAR-09, 10 niveles). El nivel del
        alumno se DERIVA de esta curva contra su XP total (RF-NIV-05, sin techo) — no hay
        endpoint que lo devuelva todavía (deuda-tecnica #10).
      tags: [niveles]
      security: [{ bearerAuth: [PROFESOR, ALUMNO] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Nivel" }
        "404":
          description: No existe roadmap para ese curso
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetail" }
    post:
      summary: >
        [IMPLEMENTADO] Definir la curva de niveles del curso (RF-CFG-05). Reemplaza la
        anterior por completo (baja lógica). El orden lo asigna el servidor por umbral
        ascendente; la curva debe arrancar en umbral_xp=0, ser estrictamente creciente y
        tener entre 1 y 10 niveles (RF-NIV-04).
      tags: [niveles]
      security: [{ bearerAuth: [PROFESOR] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [niveles]
              properties:
                niveles:
                  type: array
                  minItems: 1
                  maxItems: 10
                  items:
                    type: object
                    required: [nombre, umbralXp]
                    properties:
                      nombre: { type: string }
                      umbralXp: { type: integer, minimum: 0 }
      responses:
        "201":
          description: Curva creada — devuelve la curva vigente
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Nivel" }
        "400":
          description: Curva inválida (vacía, > 10, no arranca en 0, o no estrictamente creciente)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetail" }
        "404":
          description: No existe roadmap para ese curso
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetail" }
        "409":
          description: Curso archivado (RF-CUR-09)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetail" }

  # ── Insignias ──────────────────────────────────────────────────────
  /alumnos/{aid}/insignias:
    parameters:
      - $ref: "#/components/parameters/alumnoId"
      - $ref: "#/components/parameters/cursoCohorteIdQuery"
    get:
      summary: "[PLANEADO] Insignias ganadas en el curso"
      tags: [insignias]
      security: [{ bearerAuth: [ALUMNO, PROFESOR] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Insignia" }

  # ── Ranking ────────────────────────────────────────────────────────
  /roadmaps/{cc}/ranking:
    parameters:
      - $ref: "#/components/parameters/cursoCohorteId"
    get:
      summary: >
        [IMPLEMENTADO] Tabla de posiciones. PROFESOR (o dev local sin Gateway) recibe el
        array completo de RankingEntrada. ALUMNO (X-User-Roles=ALUMNO, sin PROFESOR)
        recibe VistaRankingAlumno: su fila + top3 + bottom3, con las filas ajenas sin
        alumnoId y los cortes de XP P90/P10 (RF-RNK-03/07). El filtrado es del servidor.
        Calculado en caliente desde las tablas base (no materializado — ver V1 / Fase 3).
      tags: [ranking]
      security: [{ bearerAuth: [ALUMNO, PROFESOR] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items: { $ref: "#/components/schemas/RankingEntrada" }
                  - $ref: "#/components/schemas/VistaRankingAlumno"
        "400":
          description: "X-User-Roles=ALUMNO sin X-User-Id"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetail" }
        "404":
          description: No existe roadmap para ese curso
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetail" }

  /roadmaps/{cc}/ranking/candidatos:
    parameters:
      - $ref: "#/components/parameters/cursoCohorteId"
    get:
      summary: "[IMPLEMENTADO] Candidatos a promoción (RF-RNK-05) y en riesgo de regularidad (RF-RNK-06)"
      tags: [ranking]
      security: [{ bearerAuth: [PROFESOR] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  promocion:
                    type: array
                    items: { $ref: "#/components/schemas/RankingEntrada" }
                  riesgoRegularidad:
                    type: array
                    items: { $ref: "#/components/schemas/RankingEntrada" }
        "404":
          description: No existe roadmap para ese curso
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetail" }

  # ── Cierre de curso ⚠️ alcance a confirmar ────────────────────────
  /roadmaps/{cc}/cierre/candidatos:
    parameters:
      - $ref: "#/components/parameters/cursoCohorteId"
    get:
      summary: >
        [IMPLEMENTADO] ⚠️ Pantalla de confirmación (RF-RNK-10): cada alumno con su
        situación de ranking, un estado sugerido y el estado ya confirmado si lo hay.
      tags: [cierre]
      security: [{ bearerAuth: [PROFESOR] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CandidatoCierre" }
        "404":
          description: No existe roadmap para ese curso
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetail" }

  /roadmaps/{cc}/cierre/confirmar:
    parameters:
      - $ref: "#/components/parameters/cursoCohorteId"
    post:
      summary: "[IMPLEMENTADO] ⚠️ Confirmar (upsert) el estado académico final de N alumnos (RF-RNK-10)"
      tags: [cierre]
      security: [{ bearerAuth: [PROFESOR] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [alumnoId, estado]
                    properties:
                      alumnoId: { type: string, format: uuid }
                      estado: { type: string, enum: [PROMOCIONADO, REGULAR, NO_REGULAR, ABANDONO] }
      responses:
        "204": { description: Confirmado }
        "400":
          description: Body inválido
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetail" }
        "404":
          description: No existe roadmap para ese curso
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetail" }

  /roadmaps/{cc}/cierre/reporte:
    parameters:
      - $ref: "#/components/parameters/cursoCohorteId"
    get:
      summary: >
        [IMPLEMENTADO] ⚠️ Reporte de cierre (RF-RNK-13): datos propios (alumnoId, estado
        final, XP, insignias). El BFF le agrega legajo y nombre.
      tags: [cierre]
      security: [{ bearerAuth: [PROFESOR, ADMIN] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/FilaReporteCierre" }

  /roadmaps/{cc}/cierre/estado:
    parameters:
      - $ref: "#/components/parameters/cursoCohorteId"
    get:
      summary: >
        [IMPLEMENTADO] ⚠️ Precondición síncrona para archivar (RF-CUR-08b) — la consulta
        Cursos. Hoy el único bloqueo chequeado es "falta confirmar algún alumno"; los
        gates por encuesta (RF-ENC-11) y scores de IA (RF-IA-34) son deuda.
      tags: [cierre]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  listoParaArchivar: { type: boolean }
                  alumnosSinConfirmar:
                    type: array
                    items: { type: string, format: uuid }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Validado por el Gateway (401 si falla). Nosotros leemos X-User-Roles ya
        verificado y decidimos el negocio (403) — ver 06-contrato-api.md §0.3.

  parameters:
    cursoCohorteId:
      name: cc
      in: path
      required: true
      schema: { type: string, format: uuid }
    cursoCohorteIdQuery:
      name: curso_cohorte_id
      in: query
      required: true
      schema: { type: string, format: uuid }
    alumnoId:
      name: aid
      in: path
      required: true
      schema: { type: string, format: uuid }
    id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }

  schemas:
    ProblemDetail:
      type: object
      description: RFC 9457 — ver 06-contrato-api.md §0.5
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        traceId: { type: string }

    Roadmap:
      type: object
      description: Metadata del roadmap. La devuelve POST /roadmaps y PUT /roadmaps/{cc}.
      properties:
        id: { type: string, format: uuid }
        cursoCohorteId: { type: string, format: uuid }
        estado: { type: string, enum: [BORRADOR, PUBLICADO] }
        creadoEn: { type: string, format: date-time }
        actualizadoEn: { type: string, format: date-time }

    GrafoRoadmap:
      type: object
      description: >
        Vista de editor de GET /roadmaps/{cc}: la metadata del roadmap más el grafo
        entero en un viaje. Secciones ordenadas por `orden`, cada una con sus nodos;
        conexiones a nivel roadmap.
      properties:
        id: { type: string, format: uuid }
        cursoCohorteId: { type: string, format: uuid }
        estado: { type: string, enum: [BORRADOR, PUBLICADO] }
        creadoEn: { type: string, format: date-time }
        actualizadoEn: { type: string, format: date-time }
        secciones:
          type: array
          items:
            allOf:
              - $ref: "#/components/schemas/Seccion"
              - type: object
                properties:
                  nodos:
                    type: array
                    items: { $ref: "#/components/schemas/Nodo" }
        conexiones:
          type: array
          items: { $ref: "#/components/schemas/Conexion" }

    NuevaSeccion:
      type: object
      required: [nombre, umbralXpDesbloqueo, orden]
      properties:
        nombre: { type: string }
        umbralXpDesbloqueo: { type: integer }
        orden: { type: integer }

    Seccion:
      allOf:
        - $ref: "#/components/schemas/NuevaSeccion"
        - type: object
          properties:
            id: { type: string, format: uuid }
            roadmapId: { type: string, format: uuid }

    NuevoNodo:
      type: object
      required: [seccionId, tipo, posicionX, posicionY]
      properties:
        seccionId: { type: string, format: uuid }
        tipo:
          type: string
          description: >
            ⚠️ Extensión propuesta sobre el modelo original — ver 02-modelo-de-datos.md §4.
            RECUPERACION ya NO es un tipo de nodo: el pool de recuperación es por curso
            (DesafioRecuperacion), no un nodo del mapa.
          enum: [TEORIA, PRACTICA, DESAFIO_TEORICO, DESAFIO_PRACTICO, HITO, BOSS]
        desafioId:
          type: string
          format: uuid
          nullable: true
          description: "Nulo obligatoriamente para HITO; opcional para el resto."
        posicionX: { type: number }
        posicionY: { type: number }
        esObligatorio: { type: boolean, default: true }
        reintentosPermitidos: { type: integer, minimum: 0, maximum: 3, default: 0 }

    Nodo:
      allOf:
        - $ref: "#/components/schemas/NuevoNodo"
        - type: object
          properties:
            id: { type: string, format: uuid }
      description: >
        El estado del nodo (BLOQUEADO/HABILITADO/…) NO viaja acá: es por alumno y vive en
        ProgresoNodo (GET /alumnos/{aid}/progreso), no en el grafo del editor.

    NuevaConexion:
      type: object
      required: [nodoOrigenId, nodoDestinoId]
      properties:
        nodoOrigenId: { type: string, format: uuid }
        nodoDestinoId: { type: string, format: uuid }

    Conexion:
      allOf:
        - $ref: "#/components/schemas/NuevaConexion"
        - type: object
          properties:
            id: { type: string, format: uuid }
            roadmapId: { type: string, format: uuid }

    ProgresoNodo:
      type: object
      properties:
        nodoId: { type: string, format: uuid }
        estado: { type: string, enum: [BLOQUEADO, HABILITADO, COMPLETADO, FALLADO] }
        intentosUsados: { type: integer }
        completadoEn: { type: string, format: date-time, nullable: true }

    XpResumen:
      type: object
      properties:
        xpTotal: { type: integer }
        movimientos:
          type: array
          items:
            type: object
            properties:
              tipo:
                type: string
                enum: [OTORGADO_DESAFIO, AJUSTE_USO_IA, AJUSTE_APELACION, DESAFIO_PERSONALIZADO]
              monto: { type: integer, description: "Puede ser negativo (RF-IA-18)" }
              registradoEn: { type: string, format: date-time }

    VidasEstado:
      type: object
      description: "⚠️ Alcance a confirmar — ver README.md §1.2"
      properties:
        vidasVigentes: { type: integer }
        vidasPerdidasHistorico: { type: integer, description: "Nunca decrece (RF-RNK-05)" }

    RecuperacionAsignada:
      type: object
      description: "RF-REC-04 — el desafioId externo que el alumno debe resolver"
      properties:
        desafioId: { type: string, format: uuid }

    Nivel:
      type: object
      properties:
        nombre: { type: string }
        umbralXp: { type: integer }
        orden: { type: integer }

    Insignia:
      type: object
      properties:
        insigniaId: { type: string, format: uuid }
        otorgadaEn: { type: string, format: date-time }

    RankingEntrada:
      type: object
      description: >
        Datos propios únicamente — el nombre/avatar/monedas los agrega el BFF
        (no nuestro) al armar la pantalla. Ver 06-contrato-api.md §6.2. En la vista de
        ALUMNO, alumnoId es null en las filas ajenas (RF-RNK-07).
      properties:
        alumnoId: { type: string, format: uuid, nullable: true }
        xpTotal: { type: integer }
        posicion: { type: integer }
        percentil: { type: number, nullable: true, description: "null con < 10 inscriptos activos (RF-RNK-09)" }
        zona: { type: string, enum: [NINGUNA, P90, P10] }
        insigniasCount: { type: integer }
        vidasPerdidasHistorico: { type: integer }
        ejerciciosCompletados: { type: integer }
        candidatoPromocion: { type: boolean, description: "RF-RNK-05" }
        riesgoRegularidad: { type: boolean, description: "RF-RNK-06" }

    CandidatoCierre:
      type: object
      description: "Fila de la pantalla de confirmación de cierre (RF-RNK-10)."
      properties:
        alumnoId: { type: string, format: uuid }
        xpTotal: { type: integer }
        zona: { type: string, enum: [NINGUNA, P90, P10] }
        candidatoPromocion: { type: boolean }
        riesgoRegularidad: { type: boolean }
        estadoSugerido: { type: string, enum: [PROMOCIONADO, REGULAR, NO_REGULAR, ABANDONO] }
        estadoConfirmado:
          type: string
          nullable: true
          enum: [PROMOCIONADO, REGULAR, NO_REGULAR, ABANDONO]

    FilaReporteCierre:
      type: object
      description: "Fila del reporte de cierre (RF-RNK-13). Legajo y nombre los agrega el BFF."
      properties:
        alumnoId: { type: string, format: uuid }
        estadoFinal:
          type: string
          nullable: true
          enum: [PROMOCIONADO, REGULAR, NO_REGULAR, ABANDONO]
        xpTotal: { type: integer }
        insigniasCount: { type: integer }

    VistaRankingAlumno:
      type: object
      description: "Lo que ve el ALUMNO en GET /ranking (RF-RNK-03/07)."
      properties:
        miFila: { $ref: "#/components/schemas/RankingEntrada" }
        top3:
          type: array
          items: { $ref: "#/components/schemas/RankingEntrada" }
        bottom3:
          type: array
          items: { $ref: "#/components/schemas/RankingEntrada" }
        corteXpP90: { type: integer, nullable: true }
        corteXpP10: { type: integer, nullable: true }
